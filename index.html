<style>
:root{
  --navy:#1f325d;
  --navy-2:#2a4270;
  --book-blue:#f9b754;
  --gold:#7ea1d9;
  --gold-deep:#5c7fb8;
  --gold-light:#d3e0f5;
  --sky:#ccd9e2;
  --cream:#fce8cf;
  --bg:#fdf4e9;
  --bg-2:#f5e8d5;
  --surface:#ffffff;
  --surface-2:#faf4e6;
  --text:#1c2a3d;
  --text-dim:#6b7686;
  --border:#e6ddc6;
  --danger:#b4483c;
  --ok:#4a8a6a;
  --warn:#c78a3a;
  --shadow: 0 6px 20px rgba(0,30,80,.08);
  --radius:18px;
  --radius-sm:12px;
  --font-head:"Traditional Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --font-body:"Segoe UI",Tahoma,Arial,sans-serif;
  --safe-top: env(safe-area-inset-top,0px);
  --safe-bottom: env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#0e1420;
  --bg-2:#0a0f18;
  --surface:#161f30;
  --surface-2:#1c2740;
  --text:#eaf0fb;
  --text-dim:#9aa8c0;
  --border:#2a3752;
  --shadow: 0 6px 24px rgba(0,0,0,.4);
  --gold:#7ea1d9;
  --gold-deep:#5c7fb8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  font-style:normal;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body, input, textarea, button, select{ font-style:normal !important; }
::selection{ background:var(--gold-light); color:var(--navy);}
button{font-family:inherit; font-style:normal;}
input,textarea,select{font-family:inherit; font-style:normal;}
.app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  padding-bottom: calc(168px + var(--safe-bottom));
  position:relative;
}
.topbar{
  position:sticky; top:0; z-index:30;
  background:linear-gradient(180deg, var(--bg) 80%, transparent);
  padding: calc(14px + var(--safe-top)) 16px 10px;
  display:flex; align-items:center; justify-content:space-between;
  backdrop-filter:blur(6px);
}
.topbar h1{ font-family:var(--font-head); font-size:22px; margin:0; color:var(--navy); font-weight:800; letter-spacing:.5px;}
.topbar-icon{ width:52px; height:52px; border-radius:15px; object-fit:cover; box-shadow:0 6px 18px rgba(249,183,84,.4); border:2px solid var(--book-blue); flex-shrink:0;}
.icon-toggle-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface); color:var(--book-blue); display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:var(--shadow); flex-shrink:0;
}
.icon-toggle-btn svg{width:19px; height:19px;}
[data-theme="dark"] .topbar h1{ color:var(--gold); }
.topbar .sub{font-size:12px;color:var(--text-dim); margin-top:2px;}
main{padding:0 16px 24px; overflow-wrap:break-word; max-width:100%;}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.card h3{margin:0 0 8px; font-family:var(--font-head); font-size:17px;}
.muted{color:var(--text-dim); font-size:13px;}
.row{display:flex; align-items:center; gap:10px;}
.row.between{justify-content:space-between;}
.row.wrap{flex-wrap:wrap;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 18px; border-radius:14px; border:none;
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));
  color:var(--navy); font-weight:700; font-size:14.5px;
  cursor:pointer; box-shadow:0 4px 14px rgba(126,161,217,.35);
  transition:transform .12s;
}
.btn:active{transform:scale(.96);}
.btn.secondary{ background:var(--surface-2); color:var(--book-blue); border:1px solid rgba(249,183,84,.35); box-shadow:none;}
.btn.ghost{ background:transparent; color:var(--navy); box-shadow:none; padding:8px 10px;}
[data-theme="dark"] .btn.ghost{ color:var(--gold); }
.btn.danger{ background:var(--danger); color:#fff; box-shadow:none;}
.btn.block{width:100%;}
.btn.sm{padding:7px 12px; font-size:13px; border-radius:10px;}
.btn:disabled{opacity:1; cursor:not-allowed; background:var(--surface-2) !important; color:var(--text-dim) !important; box-shadow:none !important; border:1px solid var(--border);}
.pill{
  display:inline-flex; align-items:center; gap:4px;
  background:var(--surface-2); border:1px solid var(--border);
  padding:4px 10px; border-radius:999px; font-size:12px; color:var(--text-dim);
}
.pill.gold{ background:rgba(254,195,93,.22); color:var(--gold-deep); border-color:rgba(254,195,93,.5); font-weight:700;}
[data-theme="dark"] .pill.gold{ color:var(--gold); }
.pill.status-learning{color:#a86a2e; background:rgba(200,140,60,.15);}
.pill.status-reviewing{color:var(--book-blue); background:rgba(249,183,84,.15);}
.pill.status-completed{color:#4d8a4a; background:rgba(77,138,74,.15);}
input[type=text],input[type=number],input[type=time],textarea,select{
  width:100%; padding:11px 13px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:14.5px; outline:none;
}
textarea{min-height:90px; resize:vertical; line-height:1.6;}
label.field{display:block; margin-bottom:12px;}
label.field > span{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:5px; font-weight:600;}
.hr{height:1px;background:var(--border); margin:14px 0; border:none;}
h2.section-title{font-family:var(--font-head); font-size:19px; margin:22px 0 12px; color:var(--text);}
.empty{ text-align:center; padding:34px 18px; color:var(--text-dim);}
.empty .glyph{font-size:34px; margin-bottom:8px;}
.bottom-nav{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:560px;
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex; padding: 8px 6px calc(8px + var(--safe-bottom));
  z-index:40;
  box-shadow: 0 -6px 20px rgba(0,0,0,.06);
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--text-dim); font-size:11px; padding:6px 2px; border-radius:12px; cursor:pointer;
  background:none; border:none; font-weight:600;
}
.nav-item .ic{font-size:19px; display:inline-flex; align-items:center; justify-content:center; padding:5px 12px; border-radius:11px; margin-bottom:1px; transition:background .15s, opacity .15s; color:var(--text); opacity:.62;}
.nav-item.active{color:var(--navy);}
[data-theme="dark"] .nav-item.active{color:var(--gold);}
.nav-item.active .ic{ background:rgba(254,195,93,.25); opacity:1; color:var(--gold-deep); }
[data-theme="dark"] .nav-item.active .ic{ color:var(--gold); }
.nav-item .ic svg{width:23px;height:23px;display:block;margin:0 auto;}
.fab-notes{
  position:fixed; left:14px; bottom:calc(100px + var(--safe-bottom));
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));
  display:flex;align-items:center;justify-content:center; font-size:22px;
  box-shadow:0 8px 20px rgba(126,161,217,.45); z-index:45; cursor:pointer; color:var(--navy);
  border:none;
}
.fab-notes:active{transform:scale(.93);}
.fab-notes svg{width:25px;height:25px;}
.streak-flame{
  display:flex; align-items:center; gap:6px; background:linear-gradient(135deg,var(--gold-light),var(--gold));
  color:var(--navy); padding:8px 14px; border-radius:16px; font-weight:800; font-size:14px;
  box-shadow: 0 4px 14px rgba(126,161,217,.3);
}
[data-theme="dark"] .streak-flame{ background:linear-gradient(135deg,#5c3a12,#7a4d16); color:#ffdca0;}
.progress-bar{height:8px;border-radius:6px;background:var(--border); overflow:hidden;}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-deep));}
.banner{
  border-radius:14px; padding:12px 14px; margin-bottom:14px; font-size:13.5px; line-height:1.7;
  border:1px solid; display:flex; gap:10px; align-items:flex-start;
}
.banner.warn{background:rgba(199,138,58,.1); border-color:rgba(199,138,58,.35); color:#8a5a1f;}
.banner.info{background:rgba(249,183,84,.1); border-color:rgba(249,183,84,.3); color:#2f5680;}
.banner.scold{background:rgba(180,72,60,.1); border-color:rgba(180,72,60,.35); color:#8a3a2f;}
[data-theme="dark"] .banner.warn{color:#e0b57a;}
[data-theme="dark"] .banner.info{color:#8fb3de;}
[data-theme="dark"] .banner.scold{color:#e08a7a;}
.folder-row, .item-row{
  display:flex; align-items:center; gap:12px; padding:13px 12px; border-radius:14px;
  background:var(--surface); border:1px solid var(--border); margin-bottom:8px; cursor:pointer;
}
.folder-row .ic, .item-row .ic{font-size:20px; flex-shrink:0;}
.folder-row .meta, .item-row .meta{flex:1; min-width:0;}
.folder-row .name, .item-row .name{font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.folder-row .sub, .item-row .sub{font-size:12px; color:var(--text-dim); margin-top:2px;}
.tag-chip{background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px 10px; font-size:11.5px; color:var(--text-dim);}
.tag-chip.on{background:rgba(254,195,93,.22); color:var(--gold-deep); border-color:rgba(254,195,93,.5); font-weight:700;}
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,15,25,.55); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal-sheet{
  background:var(--bg); width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
  border-radius:22px 22px 0 0; padding:20px 18px calc(24px + var(--safe-bottom));
  animation: slideup .22s ease-out; position:relative;
}
@keyframes slideup{ from{transform:translateY(30px); opacity:.4;} to{transform:translateY(0); opacity:1;} }
.modal-handle{width:40px;height:4px;background:var(--border); border-radius:4px; margin:0 auto 14px;}
.modal-close-btn{
  position:absolute; top:14px; left:14px; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:5;
}
.game-card{
  border-radius:18px; padding:18px; margin-bottom:12px; cursor:pointer;
  border:2px solid var(--border); background:var(--surface); transition:.15s;
}
.game-card.selected{border-color:var(--gold-deep); background:rgba(254,195,93,.1);}
.game-card h4{margin:0 0 4px; font-family:var(--font-head); font-size:16px;}
.dragitem{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:12px 14px; margin-bottom:8px; cursor:grab; display:flex; align-items:center; gap:10px;
  font-size:14px; line-height:1.6;
}
.dragitem.dragging{opacity:.4;}
.dragitem .num{width:24px;height:24px;border-radius:50%;background:var(--surface-2); display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:800; color:var(--gold-deep); flex-shrink:0;}
.dragitem.correct{border-color:var(--ok); background:rgba(74,138,106,.1);}
.dragitem.wrong{border-color:var(--danger); background:rgba(180,72,60,.1);}
.flashcard{
  background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:26px 20px;
  min-height:180px; display:flex; align-items:center; justify-content:center; text-align:center;
  font-size:16.5px; line-height:1.8; box-shadow:var(--shadow); cursor:pointer;
  overflow-wrap:break-word; max-width:100%;
}
.flashcard > div{ max-width:100%; overflow-wrap:break-word; }
.timer-pill{position:fixed; top:calc(10px + var(--safe-top)); left:14px; z-index:41; background:var(--surface); border:1px solid var(--border); padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:700; box-shadow:var(--shadow);}
.diff-added{background:rgba(180,72,60,.25); border-radius:4px; padding:0 2px;}
.blank-input{display:inline-block; width:110px; border-bottom:2px solid var(--gold-deep); border-top:none;border-right:none;border-left:none; background:transparent; text-align:center; font-weight:700; color:var(--gold-deep); padding:2px 4px; margin:0 3px;}
.blank-input.ok{color:var(--ok); border-color:var(--ok);}
.blank-input.bad{color:var(--danger); border-color:var(--danger);}
.toast{
  position:fixed; bottom:calc(96px + var(--safe-bottom)); left:50%; transform:translateX(-50%);
  background:var(--navy); color:#fff; padding:11px 20px; border-radius:14px; font-size:13.5px;
  z-index:200; box-shadow:0 8px 20px rgba(0,0,0,.3); max-width:88%; text-align:center; line-height:1.6;
}
[data-theme="dark"] .toast{background:var(--gold); color:var(--navy); font-weight:700;}
.switch{position:relative; width:46px; height:26px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch .slider{position:absolute; inset:0; background:var(--border); border-radius:999px; transition:.2s; cursor:pointer;}
.switch .slider:before{content:""; position:absolute; height:20px; width:20px; right:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
.switch input:checked + .slider{background:var(--gold-deep);}
.switch input:checked + .slider:before{transform:translateX(-20px);}
.daychip{ width:40px;height:40px;border-radius:12px; display:flex;align-items:center;justify-content:center; font-size:12.5px; font-weight:700; background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); cursor:pointer;}
.daychip.study{ background:var(--book-blue); color:#fff; border-color:var(--book-blue);}
.daychip.review{ background:var(--book-blue); color:#fff; border-color:var(--book-blue);}
.prompt-box{background:var(--surface-2); border:1px dashed var(--border); border-radius:14px; padding:14px; font-size:12.5px; line-height:1.9; white-space:pre-wrap; max-height:260px; overflow-y:auto; color:var(--text-dim); font-family:ui-monospace,Consolas,monospace;}
.tab-strip{display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;}
.tab-btn{padding:8px 16px; border-radius:12px; border:1px solid var(--border); background:var(--surface); font-size:13px; font-weight:700; color:var(--text-dim); white-space:nowrap; cursor:pointer;}
.tab-btn.active{background:var(--gold-deep); color:var(--navy); border-color:var(--gold-deep);}
.part-item{border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:8px; background:var(--surface-2);}
.neglect-flag{color:var(--danger); font-size:11px; font-weight:800;}
a{color:var(--navy);}
[data-theme="dark"] a{color:var(--gold);}
::-webkit-scrollbar{width:0; height:0;}
.csel{position:relative; flex:1; min-width:0;}
.csel-btn{
  width:100%; text-align:right; padding:11px 13px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:14px; cursor:pointer;
  display:flex; align-items:center; justify-content:space-between; gap:6px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.csel-btn .chev{font-size:11px; color:var(--text-dim); flex-shrink:0; transition:transform .15s;}
.csel.open .csel-btn .chev{transform:rotate(180deg);}
.csel.open .csel-btn{border-color:var(--gold-deep);}
.csel-panel{
  position:absolute; top:calc(100% + 6px); right:0; left:0; z-index:60;
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); max-height:230px; overflow-y:auto; display:none; padding:6px;
}
.csel.open .csel-panel{display:block;}
.csel-opt{padding:11px 12px; border-radius:9px; font-size:14px; cursor:pointer; color:var(--text);}
.csel-opt:active{background:var(--surface-2);}
.csel-opt.selected{background:rgba(254,195,93,.18); color:var(--gold-deep); font-weight:700;}
.type-chip{padding:3px 9px; border-radius:8px; font-size:11px; font-weight:700;}
.type-lesson{background:rgba(249,183,84,.16); color:var(--book-blue);}
.type-exam{background:rgba(180,72,60,.14); color:var(--danger);}
.type-research{background:rgba(74,138,106,.15); color:var(--ok);}
.type-thesis{background:rgba(126,161,217,.18); color:var(--gold-deep);}
.mode-chip{padding:3px 9px; border-radius:8px; font-size:11px; font-weight:700; background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);}
</style>
</head>

  n => `هذا انقطاعك رقم ${n} المتكرر. اعلمي أن النجاح يُبنى بالمثابرة لا بالتمني، فجدّي واجتهدي.`,

function nudgeRepeatMessage(n){
  const f = NUDGES_REPEAT_TEMPLATES[Math.floor(Math.random()*NUDGES_REPEAT_TEMPLATES.length)];
  return f(n);
}

function uid(){ return 'id' + (Date.now().toString(36)) + Math.random().toString(36).slice(2,7); }
function todayStr(d){ const dt = d?new Date(d):new Date(); const y=dt.getFullYear(),m=String(dt.getMonth()+1).padStart(2,'0'),day=String(dt.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function addDays(dateStr, n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return todayStr(d); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function weekdayOf(dateStr){ return new Date(dateStr+'T00:00:00').getDay(); }
function fmtDateAr(dateStr){ const d=new Date(dateStr+'T00:00:00'); return d.toLocaleDateString('ar-EG-u-nu-latn',{year:'numeric',month:'long',day:'numeric'}); }
function fmtShortDate(d){ const dt=new Date(d+'T00:00:00'); return `${AR_DAYS_SHORT[dt.getDay()]} ${dt.getDate()}/${dt.getMonth()+1}`; }
function todayStr0(ts){ return todayStr(new Date(ts)); }
function stripDiacritics(s){ return (s||'').replace(/[\u064B-\u0652\u0670\u0640]/g,'').replace(/\s+/g,' ').trim().toLowerCase(); }
/* يكتشف الأجزاء/البطاقات الإثرائية التي يُضيفها الذكاء الاصطناعي من إبداعه (لا من الدرس
   الأصلي)، والتي يجب أن تبدأ نصّها بعلامة "💡 إثراء:" وفق تعليمات البرومبتات، لتمييزها
   بصرياً بوضوح عن محتوى الدرس الحقيقي في كل مكان تُعرض فيه. */
function isEnrichment(text){ return (text||'').trim().startsWith('💡'); }
/* النص الأصلي الكامل للعنصر، ليقارَن به الاسترجاع الحر: في وضع الملخص الشامل هو كل نصوص
   الأجزاء مجمّعة بترتيبها، وفي وضع البطاقات الدقيقة هو حقل "نص الدرس الأصلي" إن كان مُدخَلاً. */
function getFullOriginalText(it){
  if(it.mode==='summary'){
    if(!it.parts.length) return '';
    return it.parts.map((p,i)=>`(${i+1}) ${p.text}`).join('\n\n');
  }
  return it.sourceText || '';
}
function normalizeArabicDigits(s){
  const map = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','٫':'.','،':''};
  return (s||'').replace(/[٠-٩٫،]/g, ch=>map[ch]!==undefined?map[ch]:ch);
}
/* مطابقة إجابة تتسامح رقمياً: 3.5 = 3.50 = ٣.٥ متكافئة، إلى جانب المطابقة النصية المعتادة
   المتجاهلة للتشكيل فقط (لا مرادفات). تُستخدم في لعبة الفراغات المفتاحية. */
function answersMatch(userVal, correctVal){
  if(stripDiacritics(userVal) === stripDiacritics(correctVal)) return true;
  const na = parseFloat(normalizeArabicDigits(userVal).replace(/,/g,'').trim());
  const nb = parseFloat(normalizeArabicDigits(correctVal).replace(/,/g,'').trim());
  if(!isNaN(na) && !isNaN(nb) && normalizeArabicDigits(userVal).trim()!=='' ) return Math.abs(na-nb) < 0.0001;
  return false;
}

/* ضغط الصور تلقائياً قبل التخزين (تصغير الأبعاد + ضغط الجودة) حتى لا تُثقِل IndexedDB
   بمرور سنوات الاستخدام غير المحدودة السعة. */
function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1000; quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('تعذّرت قراءة الصورة'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('تعذّرت قراءة الملف'));
    reader.readAsDataURL(file);
  });
}
/* عنصر رفع صورة قابل لإعادة الاستخدام: يُعيد عنصر DOM + دالة getValue() تُرجع
   base64 الصورة الحالية أو null. currentImage: القيمة المبدئية إن وُجدت. */
function imageUploadField(label, currentImage){
  const wrap = el(`<label class="field"><span>${esc(label)}</span>
    <div class="img-preview" style="margin-bottom:6px;"></div>
    <input type="file" accept="image/*">
  </label>`);
  const preview = wrap.querySelector('.img-preview');
  const fileInput = wrap.querySelector('input[type=file]');
  let current = currentImage || null;
  function drawPreview(){
    preview.innerHTML = current
      ? `<div style="position:relative; display:inline-block;"><img src="${current}" style="max-width:100%; max-height:160px; border-radius:10px; display:block;"><button type="button" class="btn danger sm" data-rm style="position:absolute; top:4px; left:4px;">إزالة</button></div>`
      : '';
    const rm = preview.querySelector('[data-rm]');
    if(rm) rm.onclick=()=>{ current=null; fileInput.value=''; drawPreview(); };
  }
  fileInput.onchange = async ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    try{ current = await compressImage(file); drawPreview(); }
    catch(e){ toast('تعذّر تحميل الصورة'); }
  };
  drawPreview();
  wrap.getValue = ()=>current;
  return wrap;
}

function readFileAsDataUri(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error('تعذّرت قراءة الملف'));
    reader.readAsDataURL(file);
  });
}
/* رفع مرفق عام (PDF، Word، عرض تقديمي...) بلا أي مكتبة تحليل خارجية: يُخزَّن الملف
   كما هو data URI. الـPDF قابل للعرض داخل التطبيق فعلياً عبر عارض المتصفح الأصلي؛
   أنواع أخرى كـWord تُحفظ للتنزيل والفتح خارجياً فقط، لعدم وجود عارض متصفح أصلي لها. */
function fileUploadField(label, currentFile){
  const wrap = el(`<label class="field"><span>${esc(label)}</span>
    <div class="file-preview" style="margin-bottom:6px;"></div>
    <input type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,image/*">
  </label>`);
  const preview = wrap.querySelector('.file-preview');
  const fileInput = wrap.querySelector('input[type=file]');
  let current = currentFile || null;
  function drawPreview(){
    preview.innerHTML = current
      ? `<div class="row between" style="background:var(--surface-2); padding:9px 12px; border-radius:10px;">
           <span style="font-size:13px;">📎 ${esc(current.name)} (${Math.round(current.size/1024)} كي.ب)</span>
           <button type="button" class="btn danger sm" data-rm>إزالة</button>
         </div>`
      : '';
    const rm = preview.querySelector('[data-rm]');
    if(rm) rm.onclick=()=>{ current=null; fileInput.value=''; drawPreview(); };
  }
  fileInput.onchange = async ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    if(file.size > 15*1024*1024) toast('⚠️ الملف كبير (أكثر من 15 م.ب) — سيستهلك مساحة تخزين ملحوظة مع تراكم الملفات عبر السنوات.', 4500);
    try{
      const dataUri = await readFileAsDataUri(file);
      current = {name:file.name, mime:file.type, dataUri, size:file.size};
      drawPreview();
    }catch(e){ toast('تعذّر تحميل الملف'); }
  };
  drawPreview();
  wrap.getValue = ()=>current;
  return wrap;
}
/* يعرض المرفق بالشكل الأنسب لنوعه: صورة تُعرض مباشرة، PDF يُعرض داخل التطبيق فعلياً
   عبر عارض المتصفح الأصلي، وأي نوع آخر (Word مثلاً) يظهر كرابط تنزيل فقط. */
function renderFileAttachmentHtml(file){
  if(!file) return '';
  if(file.mime==='application/pdf'){
    return `<div style="margin-top:10px;">
      <embed src="${file.dataUri}" type="application/pdf" style="width:100%; height:420px; border-radius:10px; border:1px solid var(--border);">
      <div style="margin-top:6px;"><a href="${file.dataUri}" download="${esc(file.name)}" class="btn ghost sm">⬇️ تحميل ${esc(file.name)}</a></div>
    </div>`;
  }
  if(file.mime && file.mime.startsWith('image/')){
    return `<img src="${file.dataUri}" style="max-width:100%; border-radius:10px; margin-top:10px;">`;
  }
  return `<div style="margin-top:10px;"><a href="${file.dataUri}" download="${esc(file.name)}" class="btn secondary sm">📎 تحميل ${esc(file.name)} (لا يمكن عرضه داخل التطبيق مباشرة)</a></div>`;
}

/* ============================================================
   طبقة التخزين — IndexedDB حصراً
   ============================================================ */
let STORAGE_OK = true;
let STORAGE_WARNED = false;
let DB_PROMISE = null;
function idbOpen(){
  if(DB_PROMISE) return DB_PROMISE;
  DB_PROMISE = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB غير مدعوم')); return; }
    let req;
    try{ req = indexedDB.open(DB_NAME, 1); }catch(e){ reject(e); return; }
    req.onupgradeneeded = (e)=>{ const db=e.target.result; if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
    req.onblocked = ()=>reject(new Error('blocked'));
  });
  return DB_PROMISE;
}
function idbGet(key){ return idbOpen().then(db=> new Promise((resolve,reject)=>{ const tx=db.transaction(DB_STORE,'readonly'); const req=tx.objectStore(DB_STORE).get(key); req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error); })); }
function idbSet(key, value){ return idbOpen().then(db=> new Promise((resolve,reject)=>{ const tx=db.transaction(DB_STORE,'readwrite'); const req=tx.objectStore(DB_STORE).put(value, key); req.onsuccess=()=>resolve(true); req.onerror=()=>reject(req.error); })); }

function deepMerge(base, over){
  if(Array.isArray(base)) return over!==undefined? over : base;
  if(typeof base === 'object' && base!==null){
    const out = {...base};
    for(const k in base){ out[k] = deepMerge(base[k], over? over[k]: undefined); }
    if(over){ for(const k in over){ if(!(k in base)) out[k]=over[k]; } }
    return out;
  }
  return over!==undefined? over : base;
}
async function loadState(){
  const base = defaultState();
  let raw = null;
  try{ raw = await idbGet(STATE_KEY); STORAGE_OK = true; }catch(e){ STORAGE_OK = false; }
  if(!raw) return base;
  const merged = deepMerge(base, raw);
  merged.version = APP_VERSION;
  return merged;
}
async function saveState(){
  try{ await idbSet(STATE_KEY, STATE); STORAGE_OK = true; }
  catch(e){
    STORAGE_OK = false;
    if(!STORAGE_WARNED){ STORAGE_WARNED = true; setTimeout(()=>toast('⚠️ التخزين (IndexedDB) غير متاح في هذا المتصفح، لن يُحفظ تقدمك تلقائياً. صدّري نسخة احتياطية يدوياً من الإعدادات.', 6000), 300); }
  }
}
let STATE = defaultState();

/* ============================================================
   محرك التكرار المتباعد الموحّد — يُطبَّق على وحدة قابلة للجدولة (unit):
   إما "عنصر كامل" (وضع الملخص الشامل) أو "بطاقة مفردة" (وضع البطاقات الدقيقة)،
   بجدولة مستقلة تماماً لكل وحدة، مطابقة لخوارزمية SM-2 المبسّطة نفسها.
   ============================================================ */
function isReviewDay(d){ return STATE.settings.reviewDays.includes(weekdayOf(d)); }
function nextValidReviewDay(d){ let x=d, g=0; while(!isReviewDay(x) && g<21){ x=addDays(x,1); g++; } return x; }

function freezeOrLightFactor(){
  if(STATE.settings.freeze.active) return 0;
  if(STATE.settings.lightModeUntil && todayStr()<=STATE.settings.lightModeUntil) return 0.4;
  return 1;
}

const RATING_ORDER = {again:0, hard:1, good:2, easy:3};
function weakestRating(ratings){
  const valid = ratings.filter(r=>r && RATING_ORDER[r]!==undefined);
  if(!valid.length) return 'good';
  return valid.reduce((worst,r)=> RATING_ORDER[r] < RATING_ORDER[worst] ? r : worst, valid[0]);
}
function ratioToRating(ratio){
  if(ratio>=0.95) return 'easy';
  if(ratio>=0.7) return 'good';
  if(ratio>=0.4) return 'hard';
  return 'again';
}

/* يُحدّث كائن srs عام (يخصّ عنصراً كاملاً أو بطاقة مفردة سيّان) */
function srsAdvance(srs, rating){
  let {intervalDays, ease, reps} = srs;
  ease = ease || 2.3;
  if(rating==='again'){
    ease = Math.max(1.3, ease-0.2); intervalDays = 1; reps = 0;
  } else {
    if(reps===0) intervalDays = 1;
    else if(reps===1) intervalDays = 3;
    else {
      let mult = ease;
      if(rating==='hard') mult = Math.max(1.15, ease-0.35);
      if(rating==='easy') mult = ease+0.3;
      intervalDays = Math.max(1, Math.round(intervalDays*mult));
    }
    if(rating==='hard') ease = Math.max(1.3, ease-0.15);
    if(rating==='easy') ease = ease+0.15;
    reps += 1;
  }
  let status = 'learning';
  if(reps>=5 && intervalDays>=30){ status='completed'; intervalDays = Math.max(intervalDays,45); }
  else if(reps>=1){ status='reviewing'; }
  const target = nextValidReviewDay(addDays(todayStr(), intervalDays));
  return { intervalDays, ease, reps, lastReviewed: todayStr(), nextReview: target, status };
}

/* ============================================================
   استخراج كل الوحدات القابلة للمراجعة من كل العناصر (موحّدة الشكل)
   ============================================================ */
function allItems(){ return Object.values(STATE.items).filter(it=>!it.archived); }
function allUnits(){
  const units = [];
  allItems().forEach(it=>{
    if(it.mode==='summary'){
      units.push({kind:'item', item:it, id:it.id, srs:it.srs, status:it.status});
    } else {
      (it.cards||[]).forEach(c=>{
        units.push({kind:'card', item:it, card:c, id:c.id, srs:c.srs, status:c.status});
      });
    }
  });
  return units;
}
function dueUnitsOn(dateStr){ return allUnits().filter(u=>u.srs && u.srs.nextReview<=dateStr); }
function newUnits(){ return allUnits().filter(u=>u.srs && !u.srs.lastReviewed); }

/* ============================================================
   جلسات الدرس والمراجعة — سعة حقيقية بلا تفاوض
   ============================================================ */
function reviewCapForMinutes(min){ return Math.max(0, Math.round(min * (8/5))); }
/* تكلفة كل نوع وحدة بالدقائق: بطاقة مراجَعة سابقاً = 5/8 دقيقة (8 بطاقات/5د)،
   بطاقة تُقابَل لأول مرة = دقيقة كاملة (أثقل ذهنياً: قراءة وفهم لا مجرد تذكّر). */
const REVIEW_COST_PER_UNIT = 5/8;
const NEW_COST_PER_UNIT = 1;

/* جلسة مراجعة موحّدة واحدة فقط: تُقدَّم فيها المستحقات المتكررة أولاً بحسب الميزانية
   الزمنية الحقيقية، ثم يُملأ ما تبقى من الوقت بوحدات جديدة (إدخال تكيّفي بلا أي
   إعداد يدوي)، دون أي فصل ظاهر للمستخدمة بين "درس" و"مراجعة". */
function getTodayUnifiedQueue(minutes){
  const today = todayStr();
  if(!isReviewDay(today)) return {units:[], repeatCount:0, newCount:0, blocked:false, notReviewDay:true, totalDueRepeats:0, totalFresh:0};
  const factor = freezeOrLightFactor();
  if(factor===0) return {units:[], repeatCount:0, newCount:0, blocked:true, totalDueRepeats:0, totalFresh:0};
  const budget = minutes * factor;

  const dueRepeats = allUnits().filter(u=>u.srs && u.srs.lastReviewed && u.srs.nextReview<=today);
  dueRepeats.sort((a,b)=>a.srs.nextReview.localeCompare(b.srs.nextReview));
  const fresh = allUnits().filter(u=>u.srs && !u.srs.lastReviewed);
  fresh.sort((a,b)=>(a.item.createdAt||0)-(b.item.createdAt||0));

  const chosen = [];
  let cost = 0;
  for(const u of dueRepeats){
    if(cost + REVIEW_COST_PER_UNIT > budget) break;
    chosen.push(u); cost += REVIEW_COST_PER_UNIT;
  }
  const repeatCount = chosen.length;

  // إدخال تكيّفي: يقلّ الجديد حين تتراكم المراجعات المستحقة الكلية، ويتوقف حين تشتد
  let adaptiveMult = 1, adaptiveNote = null;
  const reviewBaselineCards = reviewCapForMinutes(STATE.settings.reviewSessionMinutes);
  if(reviewBaselineCards>0){
    const pressure = dueRepeats.length/reviewBaselineCards;
    if(pressure>1.5){ adaptiveMult=0; adaptiveNote='توقف إدخال الجديد مؤقتاً لتراكم كبير في المراجعات المستحقة؛ ألحقي بها أولاً.'; }
    else if(pressure>0.9){ adaptiveMult=0.4; adaptiveNote='قلّ إدخال الجديد تلقائياً بسبب تراكم بعض المراجعات المستحقة.'; }
  }
  if(adaptiveMult>0){
    for(const u of fresh){
      const effectiveCost = NEW_COST_PER_UNIT/adaptiveMult;
      if(cost + effectiveCost > budget) break;
      chosen.push(u); cost += effectiveCost;
    }
  }
  const newCount = chosen.length - repeatCount;
  return { units: chosen, repeatCount, newCount, blocked:false, totalDueRepeats:dueRepeats.length, totalFresh:fresh.length, adaptiveNote };
}

/* محاكاة سعة صادقة قبل أي جدولة: توقّع العبء اليومي للأيام القادمة */
function simulateCapacity(days){
  const out=[];
  for(let i=0;i<days;i++){
    const date = addDays(todayStr(), i);
    const dueCount = allUnits().filter(u=>u.srs && u.srs.lastReviewed && u.srs.nextReview===date).length;
    out.push({ date, review:isReviewDay(date), count:dueCount });
  }
  return out;
}

/* تقدير صادق (لا موعد نهائي جازم): كم يوماً تحتاجين للّحاق بمراجعاتك المتأخرة فعلاً الآن،
   بمعدّلك الحالي — يُستثنى منه المحتوى الجديد الذي لم يُراجَع بعد، لأن ذاك بانتظار الدور
   الطبيعي لا "تأخّراً" حقيقياً. يتغيّر هذا الرقم تلقائياً مع أي تعديل في إيقاعك أو انقطاع. */
function daysToClearBacklog(){
  const today = todayStr();
  let remaining = allUnits().filter(u=>u.srs && u.srs.lastReviewed && u.srs.nextReview<=today).length;
  if(remaining<=0) return 0;
  const capPerDay = reviewCapForMinutes(STATE.settings.reviewSessionMinutes);
  if(capPerDay<=0) return null;
  let d = today, calendarDays=0, guard=0;
  while(remaining>0 && guard<400){
    d = addDays(d,1); calendarDays++;
    if(isReviewDay(d)) remaining -= capPerDay;
    guard++;
  }
  return calendarDays;
}

/* ============================================================
   الغياب والتجميد
   ============================================================ */
function checkAbsence(){
  const today = todayStr();
  const last = STATE.settings.lastActiveDate;
  if(last && last!==today && !STATE.settings.freeze.active){
    const gap = daysBetween(last, today);
    if(gap>1) return gap;
  }
  return 0;
}
async function shiftScheduleByDays(n){
  allUnits().forEach(u=>{ if(u.srs && u.srs.nextReview<=todayStr()) u.srs.nextReview = addDays(u.srs.nextReview, n); });
  await saveState();
}
async function endFreeze(){
  const gap = daysBetween(STATE.settings.freeze.startedAt, todayStr());
  await shiftScheduleByDays(gap);
  STATE.settings.freeze = {active:false, startedAt:null, reason:''};
  await saveState();
}

/* ---------------------------- Toast ---------------------------- */
function toast(msg, ms=2600){
  const root = document.getElementById('toast-root');
  const elx = document.createElement('div'); elx.className='toast'; elx.textContent=msg;
  root.appendChild(elx); setTimeout(()=>elx.remove(), ms);
}
function notify(title, body){
  if(STATE.settings.notificationsEnabled && 'Notification' in window && Notification.permission==='granted'){
    try{ new Notification(title, {body}); }catch(e){}
  }
  toast(body || title);
}

/* ---------------------------- عناصر واجهة مساعدة ---------------------------- */
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function openModal(innerHtml, onMount){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay" id="modal-ov"><div class="modal-sheet">
    <button class="modal-close-btn" id="modal-close-x" aria-label="إغلاق">✕</button>
    <div class="modal-handle"></div>${innerHtml}</div></div>`;
  document.getElementById('modal-ov').addEventListener('click', (e)=>{ if(e.target.id==='modal-ov') closeModal(); });
  document.getElementById('modal-close-x').addEventListener('click', ()=>closeModal());
  if(onMount) onMount(root);
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function customSelect(options, value, onChange){
  const wrap = el(`<div class="csel"><button type="button" class="csel-btn"><span class="lbl"></span><span class="chev">▾</span></button><div class="csel-panel"></div></div>`);
  const btn = wrap.querySelector('.csel-btn'), lbl = wrap.querySelector('.lbl'), panel = wrap.querySelector('.csel-panel');
  let current = value;
  function labelFor(v){ const o=options.find(o=>o.value===v); return o?o.label:(options[0]?options[0].label:''); }
  function draw(){
    lbl.textContent = labelFor(current);
    panel.innerHTML='';
    options.forEach(o=>{
      const item = el(`<div class="csel-opt ${o.value===current?'selected':''}">${esc(o.label)}</div>`);
      item.onclick=(e)=>{ e.stopPropagation(); current=o.value; wrap.classList.remove('open'); draw(); if(onChange) onChange(current); };
      panel.appendChild(item);
    });
  }
  btn.onclick=(e)=>{ e.stopPropagation(); document.querySelectorAll('.csel.open').forEach(x=>{ if(x!==wrap) x.classList.remove('open'); }); wrap.classList.toggle('open'); };
  draw();
  wrap.getValue=()=>current; wrap.setValue=(v)=>{current=v; draw();};
  wrap.setOptions=(newOptions)=>{ options=newOptions; draw(); };
  return wrap;
}
document.addEventListener('click', ()=>{ document.querySelectorAll('.csel.open').forEach(x=>x.classList.remove('open')); });

function render(){
  applyTheme();
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderTopbar());
  const main = document.createElement('main');
  main.id='main-content';
  app.appendChild(main);
  const routes = {
    home: screenHome, library: screenLibrary, item: screenItem,
    review: screenReview, settings: screenSettings, stats: screenStats, tools: screenTools, notes: screenNotes,
  };
  (routes[ROUTE.name]||screenHome)(main);
  app.appendChild(renderBottomNav());
  maybeShowAbsenceBanner();
}
function applyTheme(){
  const t = STATE.settings.theme;
  let dark = t==='dark' || (t==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark?'dark':'light');
}
function renderTopbar(){
  const titles = {home:'أثارة إدارة الأعمال', library:'المكتبة', item:'العنصر', review:'جلسة', settings:'الإعدادات', stats:'الإحصاءات', tools:'أدوات ذكية', notes:'دفتر الملاحظات'};
  const showIcon = ROUTE.name==='home';
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  const bar = el(`<div class="topbar">
    <div class="row" style="gap:10px;">
      ${showIcon?`<img src="${ICON_DATA_URI}" alt="أثارة إدارة الأعمال" class="topbar-icon">`:''}
      <div><h1>${titles[ROUTE.name]||'أثارة إدارة الأعمال'}</h1><div class="sub">${ROUTE.name==='home'?fmtDateAr(todayStr()):''}</div></div>
    </div>
    <div class="row" style="gap:8px;">
      <button class="icon-toggle-btn" id="quickThemeToggle" title="تبديل المظهر">${isDark?ICONS.sun:ICONS.moon}</button>
      ${ROUTE.name==='home'?`<div class="streak-flame">🔥 ${STATE.streak.count}</div>`:''}
    </div>
  </div>`);
  bar.querySelector('#quickThemeToggle').onclick=async ()=>{

}
function renderBottomNav(){

    {name:'home', ic:ICONS.home, label:'الرئيسية'},

function maybeShowAbsenceBanner(){
  const gap = checkAbsence();
  if(gap>1 && ROUTE.name==='home'){
    const main = document.getElementById('main-content');
    const b = el(`<div class="banner warn">⚠️ <div>لوحظ غياب غير مخطط له لمدة ${gap} أيام. لن تجدي تراكماً إن أزحتِ المواعيد الآن.
      <div class="row" style="margin-top:8px;">
        <button class="btn sm" id="shiftAbsBtn">إزاحة المواعيد ${gap} يوم</button>
        <button class="btn sm secondary" id="ignoreAbsBtn">تجاهل</button>
      </div></div></div>`);
    main.insertBefore(b, main.firstChild);
    b.querySelector('#shiftAbsBtn').onclick=async ()=>{ await shiftScheduleByDays(gap); STATE.settings.lastActiveDate=todayStr(); await saveState(); toast('تم إزاحة المواعيد.'); render(); };

}

/* ---------- الرئيسية ---------- */
function screenHome(main){
  if(STATE.settings.freeze.active){
    renderFreezeTakeover(main);
    return;
  }
  const quote = QUOTES[new Date().getDate()%QUOTES.length];
  main.appendChild(el(`<div class="card" style="background:linear-gradient(135deg,var(--gold-light),var(--gold)); border:none; color:var(--navy);">
    <div style="font-size:13px; font-weight:700; opacity:.8;">تذكرة اليوم</div>
    <div style="font-size:14.5px; line-height:1.9; margin-top:4px;">${quote}</div>
  </div>`));

  if(!STORAGE_OK){ main.appendChild(el(`<div class="banner warn">⚠️ التخزين (IndexedDB) غير متاح في هذا المتصفح. التطبيق يعمل الآن لكن تقدّمك لن يُحفظ. صدّري نسخة احتياطية يدوياً من الإعدادات.</div>`)); }
  if(!STATE.settings.reviewDays.length){
    main.appendChild(el(`<div class="banner info">👋 لم تختاري بعد أيام المراجعة. اذهبي إلى الإعدادات واختاري أيامك بنفسك حتى تبدأ الجلسات بالعمل.
      <div style="margin-top:8px;"><button class="btn sm" id="goSettingsBtn">فتح الإعدادات</button></div></div>`));
  }
  if(STATE.settings.lightModeUntil && todayStr()<=STATE.settings.lightModeUntil){
    main.appendChild(el(`<div class="banner info">🕊️ الوضع الخفيف مفعّل حتى ${fmtDateAr(STATE.settings.lightModeUntil)} — تم تخفيض السقف اليومي مؤقتاً.</div>`));
  }

  const today = todayStr();
  const q = getTodayUnifiedQueue(STATE.settings.reviewSessionMinutes);

  const statusLine = q.notReviewDay ? 'ليس يوم مراجعة اليوم'
    : q.blocked ? 'متوقفة بسبب التجميد'
    : (q.adaptiveNote || `${q.repeatCount} مراجعة + ${q.newCount} جديدة`);

  const sessCard = el(`<div class="card">
    <div class="row between">
      <div>
        <div class="muted" style="margin-bottom:2px;">📗 جلسة مراجعة</div>
        <div style="font-size:26px; font-weight:900;">${q.units.length}</div>
        <div class="muted">${statusLine}</div>
      </div>
      <button class="btn" id="startReview" ${q.units.length===0?'disabled':''}>ابدأ (${STATE.settings.reviewSessionMinutes} د)</button>
    </div>
  </div>`);
  main.appendChild(sessCard);
  const srBtn = sessCard.querySelector('#startReview');
  if(srBtn) srBtn.onclick=()=>openSessionMinutesPrompt();

  // تقدير أيام اللحاق بالمتراكم الحقيقي (المراجعات المتأخرة فعلاً لا الجديدة بانتظار الدور)
  const catchUpDays = daysToClearBacklog();
  if(catchUpDays>0){
    main.appendChild(el(`<div class="banner warn">⏳ بمعدّلك الحالي، ستحتاجين نحو ${catchUpDays} ${catchUpDays===1?'يوم':'أيام'} للّحاق بمراجعاتك المتأخرة فعلاً (لا الجديدة بانتظار الدور). هذا تقدير يتغيّر مع أي تعديل في إيقاعك.</div>`));
  }
  // طمأنة صريحة حين يكون التراكم مجرد محتوى جديد بانتظار الدور، لا مراجعات حقيقية متأخرة
  if(catchUpDays===0 && q.totalFresh>5){
    main.appendChild(el(`<div class="banner info">🌱 لديك ${q.totalFresh} بطاقة/عنصر جديد بانتظار الدور — هذا طبيعي تماماً ولا داعي للقلق، يدخل تدريجياً بحسب سقفك اليومي. لا مراجعات متأخرة عليك الآن.</div>`));
  }

  const ef = main.querySelector('#endFreezeBtn'); if(ef) ef.onclick=async ()=>{ await endFreeze(); toast('انتهى التجميد.'); render(); };
  const gsb = main.querySelector('#goSettingsBtn'); if(gsb) gsb.onclick=()=>nav('settings');

  // لوحة السعة القادمة (صدق قبل اكتمال الصورة)
  const sim = simulateCapacity(14);
  main.appendChild(el(`<h2 class="section-title">لوحة السعة القادمة</h2>`));
  const capCard = el(`<div class="card"></div>`);
  sim.forEach(day=>{
    const cap = Math.max(1, reviewCapForMinutes(STATE.settings.reviewSessionMinutes));
    const pct = Math.min(100, Math.round((day.count/cap)*100));
    const tag = !day.review ? '🚫 عطلة' : fmtShortDate(day.date);
    capCard.appendChild(el(`<div style="margin-bottom:10px;">
      <div class="row between" style="font-size:12.5px; margin-bottom:4px;">
        <span>${tag} ${day.review?'📗':''}</span><span class="muted">${day.count} مستحقة</span>
      </div>
      <div class="progress-bar"><div style="width:${day.review?pct:0}%"></div></div>
    </div>`));
  });
  main.appendChild(capCard);

  const overall = allUnits();
  main.appendChild(el(`<h2 class="section-title">نظرة عامة</h2>`));
  const stCounts = {learning:0, reviewing:0, completed:0};
  overall.forEach(u=>stCounts[u.status]=(stCounts[u.status]||0)+1);
  main.appendChild(el(`<div class="card row wrap" style="gap:8px;">
    <span class="pill status-learning">مراجعة مبكرة: ${stCounts.learning||0}</span>
    <span class="pill status-reviewing">قيد المراجعة: ${stCounts.reviewing||0}</span>
    <span class="pill status-completed">مكتمل: ${stCounts.completed||0}</span>
    <span class="pill">الإجمالي: ${overall.length}</span>
  </div>`));
}

function openSessionMinutesPrompt(){
  const today = todayStr();
  const maxPerDay = STATE.settings.maxReviewSessionsPerDay;
  const doneToday = (STATE.sessionLog[today]||{}).reviewSessions || 0;
  if(maxPerDay!=null && doneToday>=maxPerDay){
    toast(`بلغتِ الحد الأقصى (${maxPerDay}) لجلسات المراجعة اليوم.`);
    return;
  }
  const defMin = STATE.settings.reviewSessionMinutes;
  openModal(`<h3 style="font-family:var(--font-head);">جلسة مراجعة</h3>
    <label class="field"><span>دقائق هذه الجلسة</span><input type="number" id="sesMin" value="${defMin}" min="1"></label>
    <div class="muted" style="margin-bottom:12px;">تُخصَّص المستحقات المتكررة أولاً، ثم يُملأ ما تبقى من الوقت تلقائياً ببطاقات جديدة.</div>
    <button class="btn block" id="goSes">ابدئي الآن</button>`, (root)=>{
    root.querySelector('#goSes').onclick=async ()=>{
      const min = parseInt(root.querySelector('#sesMin').value)||defMin;
      closeModal();
      const q = getTodayUnifiedQueue(min);
      if(!q.units.length){ toast('لا شيء متاح بهذه المدة الآن.'); return; }
      STATE.sessionLog[today] = STATE.sessionLog[today] || {reviewSessions:0};
      STATE.sessionLog[today].reviewSessions++;
      await saveState();
      nav('review', {type:'review', unitIds:q.units.map(u=>u.id), idx:0, durationMin:min});
    };
  });
}

/* ---------- المكتبة (هرمية غير محدودة: سنة ← سداسي ← مادة ← وحدة ← درس...) ---------- */
function screenLibrary(main){
  const parentId = ROUTE.params.folderId || null;
  const crumbs = [];
  let cur = parentId;
  while(cur){ const f=STATE.folders[cur]; if(!f) break; crumbs.unshift(f); cur=f.parentId; }
  if(crumbs.length){
    const bc = el(`<div class="row wrap" style="margin-bottom:10px; font-size:13px;"></div>`);
    bc.appendChild(el(`<span style="cursor:pointer; color:var(--navy); font-weight:700;" onclick="nav('library',{})">المكتبة</span>`));
    crumbs.forEach(f=>{ bc.appendChild(el(`<span class="muted">/</span>`)); bc.appendChild(el(`<span style="cursor:pointer; color:var(--navy); font-weight:700;" onclick="nav('library',{folderId:'${f.id}'})">${esc(f.name)}</span>`)); });
    main.appendChild(bc);
  }
  main.appendChild(el(`<div class="row wrap" style="margin-bottom:14px; gap:8px;">
    <button class="btn sm" id="newFolderBtn">📁 مجلد جديد</button>
    <button class="btn sm secondary" id="newItemBtn">📄 عنصر جديد</button>
    <button class="btn sm secondary" id="bulkImportBtn">📥 استيراد مجمّع</button>
  </div>`));
  main.querySelector('#newFolderBtn').onclick=()=>openFolderEditor(parentId);
  main.querySelector('#newItemBtn').onclick=()=>openItemCreator(parentId);
  main.querySelector('#bulkImportBtn').onclick=()=>openBulkImportModal(parentId);

  if(parentId){
    const notesLink = el(`<button class="btn ghost sm" style="margin-bottom:14px;">🖊️ فتح دفتر الملاحظات مصفّى على هذا المجلد</button>`);
    notesLink.onclick=()=>nav('notes', {linkedLibraryFolderId: parentId});
    main.appendChild(notesLink);
  }

  const subFolders = Object.values(STATE.folders).filter(f=>f.parentId===parentId);
  const items = Object.values(STATE.items).filter(it=>it.folderId===parentId && !it.archived);

  if(!subFolders.length && !items.length){
    main.appendChild(el(`<div class="empty"><div class="glyph">📂</div>هذا المجلد فارغ. أنشئي مجلداً فرعياً (سنة/سداسي/مادة/وحدة) أو أضيفي عنصراً جديداً.</div>`));
  }
  subFolders.forEach(f=>{
    const countItems = Object.values(STATE.items).filter(it=>it.folderId===f.id && !it.archived).length;
    const subf = Object.values(STATE.folders).filter(x=>x.parentId===f.id).length;
    const row = el(`<div class="folder-row"><span class="ic">📁</span><div class="meta"><div class="name">${esc(f.name)}</div><div class="sub">${countItems} عنصر${subf?` · ${subf} مجلد فرعي`:''}</div></div><span class="ic">‹</span></div>`);
    row.onclick=()=>nav('library',{folderId:f.id});
    const editBtn = el(`<button class="btn ghost sm">✏️</button>`);
    editBtn.onclick=(e)=>{e.stopPropagation(); openFolderEditor(parentId, f);};
    row.appendChild(editBtn);
    main.appendChild(row);
  });
  items.forEach(it=>{
    const neglected = isNeglectedItem(it);
    const typeChip = `<span class="type-chip type-${it.type}">${ITEM_TYPES[it.type]}</span>`;
    const modeChip = `<span class="mode-chip">${it.mode==='summary'?'ملخص شامل':'بطاقات دقيقة'}</span>`;
    let subInfo;
    if(it.mode==='cards'){
      const total = (it.cards||[]).length;
      const due = (it.cards||[]).filter(c=>c.srs.lastReviewed && c.srs.nextReview<=todayStr()).length;
      subInfo = `${total} بطاقة${due?` · ${due} مستحقة`:''}`;
    } else {
      subInfo = `${it.parts.length} جزء · ${it.srs.lastReviewed ? `موعد المراجعة: ${fmtShortDate(it.srs.nextReview)}` : 'جاهز للدراسة الأولى'}`;
    }
    const row = el(`<div class="item-row"><span class="ic">🎓</span>
      <div class="meta"><div class="name">${esc(it.title)} ${neglected?'<span class="neglect-flag">● مهملة</span>':''}</div>
      <div class="sub">${typeChip} ${modeChip} · ${subInfo}</div></div>
      <span class="ic">‹</span></div>`);
    row.onclick=()=>nav('item',{id:it.id});
    main.appendChild(row);
  });
}
function isNeglectedItem(it){
  if(it.mode==='summary'){
    if(!it.srs.lastReviewed) return daysBetween(todayStr0(it.createdAt), todayStr())>14;
    return daysBetween(it.srs.lastReviewed, todayStr()) > (it.srs.intervalDays||1)*2 + 10;
  }
  const cards = it.cards||[];
  if(!cards.length) return false;
  return cards.every(c=> c.srs.lastReviewed && daysBetween(c.srs.lastReviewed, todayStr()) > (c.srs.intervalDays||1)*2 + 10);
}

function openFolderEditor(parentId, existing){
  openModal(`<h3 style="font-family:var(--font-head);">${existing?'تعديل المجلد':'مجلد جديد'}</h3>
    <label class="field"><span>اسم المجلد (سنة، سداسي، مادة، وحدة...)</span><input type="text" id="fname" value="${existing?esc(existing.name):''}" placeholder="مثال: السنة الأولى"></label>
    <div class="row"><button class="btn block" id="saveFolder">${existing?'حفظ':'إنشاء'}</button></div>
    ${existing?'<button class="btn danger block" id="delFolder" style="margin-top:10px;">حذف المجلد</button>':''}`, (root)=>{
    root.querySelector('#saveFolder').onclick=async ()=>{
      const name = root.querySelector('#fname').value.trim();
      if(!name) return toast('الرجاء إدخال اسم');
      if(existing){ existing.name=name; } else { const id=uid(); STATE.folders[id]={id,parentId,name,createdAt:Date.now()}; }
      await saveState(); closeModal(); render();
    };
    const del = root.querySelector('#delFolder');
    if(del) del.onclick=async ()=>{
      const hasChildren = Object.values(STATE.folders).some(f=>f.parentId===existing.id) || Object.values(STATE.items).some(it=>it.folderId===existing.id);
      if(hasChildren){ toast('لا يمكن حذف مجلد يحتوي عناصر. أفرغيه أولاً.'); return; }
      delete STATE.folders[existing.id]; await saveState(); closeModal(); render();
    };
  });
}

/* ---------- إنشاء عنصر جديد (درس/امتحان/بحث/مذكرة) ---------- */

    <label class="field"><span>نوع العنصر</span></label>
    <div class="row wrap" id="typeRow" style="margin-bottom:14px;">

      <button type="button" class="tab-btn" data-mode="cards">بطاقات دقيقة (سؤال/جواب، جدولة مستقلة لكل بطاقة)</button>
    </div>
    <button class="btn block" id="createItemBtn">التالي: أدخلي المحتوى</button>`, (root)=>{

    root.querySelectorAll('[data-type]').forEach(b=>{ if(b.dataset.type===chosenType) b.classList.add('active'); b.onclick=()=>{ root.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); chosenType=b.dataset.type; }; });
    root.querySelectorAll('[data-mode]').forEach(b=>{ if(b.dataset.mode===chosenMode) b.classList.add('active'); b.onclick=()=>{ root.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); chosenMode=b.dataset.mode; }; });
    root.querySelector('#createItemBtn').onclick=async ()=>{

      const base = { id, title:'عنصر جديد', folderId: folderId||null, type:chosenType, mode:chosenMode, tags:[], createdAt:Date.now(), archived:false, freeRecallAttempts:[], sourceFile:null };
      if(chosenMode==='summary'){
        base.parts = [];

/* ---------- استيراد مجمّع: مصفوفة عناصر دفعة واحدة، بترتيب يحفظ ترتيب المنهج ---------- */
function openBulkImportModal(folderId){
  openModal(`<h3 style="font-family:var(--font-head);">📥 استيراد مجمّع</h3>
    <div class="muted" style="margin-bottom:8px;">الصقي هنا مصفوفة JSON من "برومبت ٤ — استيراد مجمّع" في شاشة الأدوات الذكية. سيُنشأ كل عنصر داخل هذا المجلد بترتيب المصفوفة، وموعد أول مراجعة لكل عنصر يُحسب من تاريخ دراستك الفعلية له لا من تاريخ هذا الاستيراد.</div>
    <textarea id="bulkJson" style="min-height:220px;" placeholder='[{"mode":"summary","title":"...","parts":[...]},{"mode":"cards","title":"...","cards":[...]}]'></textarea>
    <button class="btn block" id="doBulkImport" style="margin-top:10px;">استيراد الكل</button>`, (root)=>{
    root.querySelector('#doBulkImport').onclick=async ()=>{
      let arr;
      try{ arr = JSON.parse(root.querySelector('#bulkJson').value); }
      catch(e){ toast('تعذّر قراءة JSON، تأكدي من الصيغة.'); return; }
      if(!Array.isArray(arr) || !arr.length){ toast('يجب أن يكون الناتج مصفوفة غير فارغة.'); return; }
      let created = 0;
      const baseTime = Date.now();
      arr.forEach((entry, i)=>{
        if(!entry || !entry.title) return;
        const id = uid();
        const mode = entry.mode==='cards' ? 'cards' : 'summary';
        const type = ITEM_TYPES[entry.type] ? entry.type : 'lesson';
        // زيادة طفيفة متتابعة لـcreatedAt تحفظ ترتيب المصفوفة (ترتيب المنهج) في طابور الإدخال الجديد،
        // دون أي أثر على موعد أول مراجعة فعلي (يُحسب لاحقاً من تاريخ الدراسة الحقيقي لا هنا).
        const createdAt = baseTime + i;
        const base = { id, title: entry.title, folderId: folderId||null, type, mode, tags: Array.isArray(entry.tags)?entry.tags:[], createdAt, archived:false, freeRecallAttempts:[], sourceFile:null };
        if(mode==='summary'){
          base.parts = Array.isArray(entry.parts) ? entry.parts.map(p=>({
            id:uid(), text:p.text||'', image:null, qa:p.qa||null, corrupted:p.corrupted||null, blank:p.blank||null
          })) : [];
          base.status = 'learning';
          base.srs = { intervalDays:0, ease:2.3, reps:0, lastReviewed:null, nextReview: todayStr() };
        } else {
          base.sourceText = entry.sourceText || '';
          base.cards = Array.isArray(entry.cards) ? entry.cards.map(c=>({
            id:uid(), front:c.front||'', frontImage:null, solutionSteps:c.solutionSteps||'', back:c.back||'', backImage:null,
            srs:{intervalDays:0, ease:2.3, reps:0, lastReviewed:null, nextReview: todayStr()}, status:'learning'
          })) : [];
        }
        STATE.items[id] = base;
        created++;
      });
      if(!created){ toast('لم يُستورَد أي عنصر، تحققي من وجود عناوين صحيحة في كل عنصر.'); return; }
      await saveState();
      toast(`تم استيراد ${created} عنصراً بنجاح، بترتيب دراستها كما وضعتِه.`);
      closeModal(); render();
    };
  });
}

/* ---------- شاشة العنصر (تختلف جذرياً حسب طريقة المراجعة) ---------- */

    <label class="field"><span>العنوان</span><input type="text" id="itTitle" value="${esc(it.title)}"></label>

      <span class="type-chip type-${it.type}">${ITEM_TYPES[it.type]}</span>

    </div>
  </div>`));
  main.querySelector('#saveItMeta').onclick=async ()=>{
    it.title = main.querySelector('#itTitle').value.trim()||it.title;
    it.tags = main.querySelector('#itTags').value.split(/[،,]/).map(s=>s.trim()).filter(Boolean);
    await saveState(); toast('تم الحفظ'); render();

    delete STATE.items[it.id];
    await saveState(); toast('تم حذف العنصر'); nav('library',{folderId:it.folderId||''});
  };

  // مرفق الدرس الأصلي: PDF (يُعرض داخل التطبيق فعلياً)، Word/عروض (تنزيل فقط)، أو صورة

    <h3>📎 مرفق الدرس الأصلي (اختياري)</h3>
    <div class="muted" style="margin-bottom:8px;">ارفعي ملف PDF ليُعرض مباشرة هنا وأثناء المراجعة، أو ملف Word/عرض تقديمي للتنزيل والاطلاع خارج التطبيق.</div>
    <div id="itFileWrap"></div>
    <button class="btn sm" id="saveItFile" style="margin-top:8px;">حفظ المرفق</button>
    ${it.sourceFile?renderFileAttachmentHtml(it.sourceFile):''}
  </div>`));
  const itFileField = fileUploadField('اختاري ملفاً', it.sourceFile);
  main.querySelector('#itFileWrap').appendChild(itFileField);
  main.querySelector('#saveItFile').onclick=async ()=>{
    it.sourceFile = itFileField.getValue();
    await saveState(); toast('تم حفظ المرفق'); render();
  };

  if(it.mode==='summary') renderSummaryModeContent(main, it);
  else renderCardsModeContent(main, it);

  // ملاحظات مرتبطة
  const linkedNotes = Object.values(STATE.notes).filter(n=>n.linkedItemId===it.id && !n.archived);
  if(linkedNotes.length){
    main.appendChild(el(`<h2 class="section-title">ملاحظات مرتبطة (تذكير مصاحب فقط)</h2>`));
    linkedNotes.forEach(n=>main.appendChild(el(`<div class="card"><div style="font-size:13.5px;">${esc(n.text)}</div><div class="muted" style="margin-top:4px;">${fmtShortDate(todayStr0(n.createdAt))}</div></div>`)));
  }
  const openNotesLink = el(`<button class="btn ghost sm" style="margin-bottom:10px;">🖊️ فتح دفتر الملاحظات مصفّى على هذا العنصر</button>`);
  openNotesLink.onclick=()=>nav('notes', {linkedItemId:it.id});
  main.appendChild(openNotesLink);

  // استرجاع حر
  main.appendChild(el(`<h2 class="section-title">استرجاع حر (اختياري)</h2>`));
  main.appendChild(el(`<div class="card">
    <div class="muted" style="margin-bottom:8px;">اكتبي كل ما تتذكرينه من هذا العنصر بحرية، دون تصحيح آلي، ثم قارنيه بالنص الأصلي فور الحفظ.</div>
    <button class="btn sm" id="openFreeRecall">ابدئي استرجاعاً حراً</button>
  </div>`));
  main.querySelector('#openFreeRecall').onclick=()=>openFreeRecall(it);
  if(it.freeRecallAttempts.length){
    main.appendChild(el(`<div class="muted" style="margin-bottom:8px;">أرشيف محاولاتك السابقة (الأحدث أولاً) — يمكنك مقارنة أي محاولة قديمة بالأصل في أي وقت:</div>`));
    it.freeRecallAttempts.slice().reverse().forEach(a=>{
      const card = el(`<div class="card"><div class="row between muted" style="margin-bottom:6px;"><span>${fmtShortDate(todayStr0(a.at))}</span><span>${Math.round(a.seconds/60)} د</span></div><div style="font-size:13.5px; white-space:pre-wrap;">${esc(a.text)}</div>
        <button class="btn ghost sm" data-compare style="margin-top:8px;">📖 قارني بالنص الأصلي</button>
      </div>`);
      card.querySelector('[data-compare]').onclick=()=>showRecallComparison(it, a.text, ()=>render());
      main.appendChild(card);
    });
  }
}

/* ---- وضع الملخص الشامل (مثل عصارة: أجزاء + 4 ألعاب على مستوى العنصر كله) ---- */
function renderSummaryModeContent(main, it){
  main.appendChild(el(`<div class="card row wrap" style="gap:6px;">
    <span class="pill status-${it.status}">${{learning:'مراجعة مبكرة',reviewing:'قيد المراجعة',completed:'مكتمل'}[it.status]}</span>
    <span class="pill">${it.srs.lastReviewed ? `المراجعة القادمة: ${fmtShortDate(it.srs.nextReview)}` : 'جاهز للدراسة الأولى'}</span>
    <span class="pill">${it.parts.length} جزء</span>
    <button class="btn sm" id="startReviewItem" style="margin-inline-start:auto;">▶️ ابدأ مراجعة محتسبة</button>
  </div>`));
  main.querySelector('#startReviewItem').onclick=()=>nav('review',{type:'review-single', unitIds:[it.id], idx:0, durationMin: STATE.settings.reviewSessionMinutes});
  if(it.srs.lastReviewed){
    const resetBtn = el(`<button class="btn ghost sm block" style="margin-bottom:14px; color:var(--danger);">↺ إعادة تعيين تقدم المراجعة (تبدأ كأنها لم تُراجَع بعد)</button>`);
    resetBtn.onclick=async ()=>{
      if(!confirm('سيعود هذا العنصر إلى حالة "لم تُراجَع بعد"، ويُفقَد كل تقدم فاصلها الزمني السابق. المحتوى نفسه يبقى كما هو. هل تريدين المتابعة؟')) return;
      it.srs = { intervalDays:0, ease:2.3, reps:0, lastReviewed:null, nextReview: todayStr() };
      it.status = 'learning';
      await saveState(); toast('تمت إعادة تعيين التقدم'); render();
    };
    main.appendChild(resetBtn);
  }

  main.appendChild(el(`<div class="card">
    <div class="muted" style="margin-bottom:8px;">استيراد سريع (تصفّح فقط، لا يُحتسب): الصقي هنا ناتج JSON من أحد برومبتَي "الملخص الشامل" في شاشة الأدوات الذكية.</div>
    <textarea id="importSummaryJson" placeholder='{"title":"...","tags":[...],"parts":[{"text":"...","qa":{...},"corrupted":{...},"blank":{...}}]}'></textarea>
    <button class="btn sm" id="doImportSummary" style="margin-top:8px;">استيراد</button>
  </div>`));
  main.querySelector('#doImportSummary').onclick=async ()=>{
    try{
      const data = JSON.parse(main.querySelector('#importSummaryJson').value);
      if(data.title) it.title = data.title;
      if(Array.isArray(data.tags)) it.tags = data.tags;
      if(Array.isArray(data.parts)) it.parts = data.parts.map(p=>({
        id:uid(), text:p.text||'', image:null,
        qa:p.qa||null, corrupted:p.corrupted||null, blank:p.blank||null
      }));
      await saveState(); toast('تم الاستيراد بنجاح'); render();
    }catch(e){ toast('تعذّر قراءة JSON، تأكدي من الصيغة.'); }
  };

  main.appendChild(el(`<h2 class="section-title">الأجزاء (${it.parts.length})</h2>`));
  it.parts.forEach((p,i)=>{
    const has = !!(p.qa && p.corrupted && p.blank);
    const enrich = isEnrichment(p.text);
    const pi = el(`<div class="part-item" ${enrich?'style="border-color:var(--gold-deep); background:rgba(249,183,84,.08);"':''}>
      <div class="row between"><b>جزء ${i+1}</b>${enrich?'<span class="pill gold" style="padding:1px 8px;">💡 إثراء (ليس من الدرس الأصلي)</span>':`<span class="muted">${has?'🎮 جاهز للألعاب':'بيانات ألعاب ناقصة'}</span>`}</div>
      <div style="font-size:13.5px; line-height:1.7; margin:6px 0;">${esc(p.text).slice(0,180)}${p.text.length>180?'…':''}</div>
      ${p.image?`<img src="${p.image}" style="max-width:100%; max-height:140px; border-radius:8px; margin-bottom:6px;">`:''}
      <div class="row"><button class="btn ghost sm" data-edit="${p.id}">تعديل</button><button class="btn ghost sm" data-del="${p.id}" style="color:var(--danger);">حذف</button></div>
    </div>`);
    pi.querySelector('[data-edit]').onclick=()=>openPartEditor(it,p);
    pi.querySelector('[data-del]').onclick=async ()=>{ it.parts=it.parts.filter(x=>x.id!==p.id); await saveState(); render(); };
    main.appendChild(pi);
  });
  const addBtn = el(`<button class="btn secondary block" style="margin-bottom:20px;">+ إضافة جزء</button>`);
  addBtn.onclick=()=>openPartEditor(it, null);
  main.appendChild(addBtn);
}
function openPartEditor(it, part){
  const p = part || {id:uid(), text:'', image:null, qa:null, corrupted:null, blank:null};
  const isNew = !part;
  openModal(`<h3 style="font-family:var(--font-head);">${isNew?'جزء جديد':'تعديل الجزء'}</h3>
    <label class="field"><span>نص الفكرة الرئيسية</span><textarea id="pText">${esc(p.text)}</textarea></label>
    <div id="pImageWrap"></div>
    <hr class="hr">
    <div class="muted" style="margin-bottom:8px;">حقول اختيارية لتغذية الألعاب:</div>
    <label class="field"><span>سؤال (لعبة الأسئلة العامة)</span><input type="text" id="pQ" value="${p.qa?esc(p.qa.q):''}"></label>
    <label class="field"><span>الجواب</span><input type="text" id="pA" value="${p.qa?esc(p.qa.a):''}"></label>
    <label class="field"><span>نسخة معطوبة بخطأ واحد (اصطياد الخطأ)</span><textarea id="pBroken">${p.corrupted?esc(p.corrupted.broken):''}</textarea></label>
    <label class="field"><span>نص بفراغات مرقّمة مثل ___1___ (فراغات مفتاحية، تقبل تسامحاً رقمياً تلقائياً)</span><textarea id="pBlankText">${p.blank?esc(p.blank.text):''}</textarea></label>
    <label class="field"><span>إجابات الفراغات (مفصولة بفاصلة)</span><input type="text" id="pBlankAns" value="${p.blank?(p.blank.answers||[]).join('، '):''}"></label>
    <button class="btn block" id="savePart">حفظ الجزء</button>`, (root)=>{
    const imgField = imageUploadField('صورة مرفقة (اختياري — لصيغة معقدة أو جدول أو رسم بياني)', p.image);
    root.querySelector('#pImageWrap').appendChild(imgField);
    root.querySelector('#savePart').onclick=async ()=>{
      p.text = root.querySelector('#pText').value.trim();
      p.image = imgField.getValue();
      const q=root.querySelector('#pQ').value.trim(), a=root.querySelector('#pA').value.trim();
      p.qa = (q&&a) ? {q,a} : p.qa;
      const broken = root.querySelector('#pBroken').value.trim();
      p.corrupted = broken ? {correct:p.text, broken} : p.corrupted;
      const bt = root.querySelector('#pBlankText').value.trim();
      const ba = root.querySelector('#pBlankAns').value.split(/[،,]/).map(s=>s.trim()).filter(Boolean);
      p.blank = bt ? {text:bt, answers:ba} : p.blank;
      if(!p.text){ toast('الرجاء كتابة نص الفكرة'); return; }
      if(isNew) it.parts.push(p);
      await saveState(); closeModal(); render();
    };
  });
}

/* ---- وضع البطاقات الدقيقة (سؤال/جواب، جدولة مستقلة لكل بطاقة) ---- */
function renderCardsModeContent(main, it){
  const cards = it.cards||[];
  const needsReview = c => !c.srs.lastReviewed || c.srs.nextReview<=todayStr();
  const dueCount = cards.filter(needsReview).length;
  main.appendChild(el(`<div class="card">
    <label class="field"><span>نص الدرس الأصلي (اختياري، يظهر بزر أسفل كل بطاقة أثناء المراجعة)</span><textarea id="itSourceText" style="min-height:140px;">${esc(it.sourceText||'')}</textarea></label>
    <button class="btn sm" id="saveSourceText">حفظ نص الدرس</button>
  </div>`));
  main.querySelector('#saveSourceText').onclick=async ()=>{
    it.sourceText = main.querySelector('#itSourceText').value.trim();
    await saveState(); toast('تم الحفظ');
  };
  main.appendChild(el(`<div class="card row wrap" style="gap:6px;">
    <span class="pill">${cards.length} بطاقة</span>
    <span class="pill gold">${dueCount} تحتاج مراجعة</span>
    ${cards.length? `<button class="btn sm" id="startReviewCards" style="margin-inline-start:auto;">▶️ راجعي بطاقات هذا العنصر</button>`:''}
  </div>`));
  const srb = main.querySelector('#startReviewCards');
  if(srb) srb.onclick=()=>{
    const due = cards.filter(needsReview);
    if(!due.length){ toast('لا بطاقات تحتاج مراجعة الآن من هذا العنصر.'); return; }
    nav('review',{type:'review-single', unitIds:due.map(c=>c.id), idx:0, durationMin: Math.max(1, Math.ceil(due.length * (5/8)))});
  };
  if(cards.some(c=>c.srs.lastReviewed)){
    const resetAllBtn = el(`<button class="btn ghost sm block" style="margin-bottom:14px; color:var(--danger);">↺ إعادة تعيين تقدم كل بطاقات هذا العنصر</button>`);
    resetAllBtn.onclick=async ()=>{
      if(!confirm(`سيعود كل بطاقات "${it.title}" إلى حالة "لم تُراجَع بعد"، ويُفقَد تقدمها السابق. نص الأسئلة والأجوبة يبقى كما هو. هل تريدين المتابعة؟`)) return;
      cards.forEach(c=>{ c.srs = {intervalDays:0, ease:2.3, reps:0, lastReviewed:null, nextReview:todayStr()}; c.status='learning'; });
      await saveState(); toast('تمت إعادة تعيين تقدم كل البطاقات'); render();
    };
    main.appendChild(resetAllBtn);
  }

  main.appendChild(el(`<div class="card">
    <div class="muted" style="margin-bottom:8px;">استيراد سريع (تصفّح فقط، لا يُحتسب): الصقي هنا ناتج JSON من أحد برومبتَي "البطاقات الدقيقة" في شاشة الأدوات الذكية.</div>
    <textarea id="importCardsJson" placeholder='{"sourceText":"...","cards":[{"front":"...","solutionSteps":"...","back":"..."}]}'></textarea>
    <button class="btn sm" id="doImportCards" style="margin-top:8px;">استيراد</button>
  </div>`));
  main.querySelector('#doImportCards').onclick=async ()=>{
    try{

/* ============================================================
   جلسة المراجعة الموحّدة — تُمرّر قائمة unitIds مختلطة (عناصر ملخص + بطاقات)
   ============================================================ */
function findUnitById(id){
  for(const it of allItems()){
    if(it.mode==='summary' && it.id===id) return {kind:'item', item:it};
    if(it.mode==='cards'){
      const c = (it.cards||[]).find(c=>c.id===id);
      if(c) return {kind:'card', item:it, card:c};
    }
  }
  return null;
}
function openSourceTextModal(item){
  openModal(`<h3 style="font-family:var(--font-head);">📖 ${esc(item.title)}</h3>
    <div style="font-size:14.5px; line-height:1.9; white-space:pre-wrap;">${esc(item.sourceText||(item.sourceFile?'':'لم تُدخَل نص الدرس الأصلي لهذا العنصر بعد.'))}</div>
    ${renderFileAttachmentHtml(item.sourceFile)}`);
}

let REVIEW_SESSION = null;
function screenReview(main){
  const {type, unitIds, idx} = ROUTE.params;
  if(!unitIds || idx>=unitIds.length){
    main.appendChild(el(`<div class="empty"><div class="glyph">🎉</div>أتممتِ كل ما في هذه الجلسة!</div>`));
    main.appendChild(el(`<button class="btn block" onclick="nav('home',{})">العودة للرئيسية</button>`));
    return;
  }
  const unit = findUnitById(unitIds[idx]);
  if(!unit){ nav('review', {type, unitIds, idx: idx+1, durationMin: ROUTE.params.durationMin}); return; }
  renderTimerPill();
  if(unit.kind==='card') return renderCardReview(main, unit, unitIds, idx);

  const it = unit.item;
  if(!REVIEW_SESSION || REVIEW_SESSION.unitId!==it.id){
    REVIEW_SESSION = { unitId:it.id, startedAt:Date.now(), stage:'structure', chosenGames:[], gameIdx:0, notifiedTimer:false,
      implicit:{structure:null,qa:null,error:null,blank:null}, qaStats:{correct:0,wrong:0}, errorStats:{found:0,total:0}, blankStats:{correct:0,total:0} };
  }
  if(REVIEW_SESSION.stage==='structure') return renderStructureGame(main, it, unitIds, idx);
  if(REVIEW_SESSION.stage==='select') return renderGameSelect(main, it, unitIds, idx);
  if(REVIEW_SESSION.stage==='playing') return renderGamePlay(main, it, unitIds, idx);
  if(REVIEW_SESSION.stage==='rate') return renderRatingSummary(main, it, unitIds, idx);
}
/* مؤقّت الجلسة تنازلي: يبدأ من مدة الجلسة المختارة وينزل نحو الصفر؛ بعد انتهاء الوقت المقدَّر
   يستمر بعرض الوقت الإضافي بعلامة + بهدوء دون أي تنبيه مزعج. */
let SESSION_TIMER_START = null;
let SESSION_DURATION_SEC = null;
function renderTimerPill(){
  document.querySelectorAll('.timer-pill').forEach(p=>p.remove());
  if(ROUTE.params.idx===0 || !SESSION_TIMER_START){
    SESSION_TIMER_START = Date.now();
    SESSION_DURATION_SEC = Math.max(60, (ROUTE.params.durationMin || STATE.settings.reviewSessionMinutes || 20) * 60);
  }
  const pill = el(`<div class="timer-pill">⏱ <span id="timerTxt">00:00</span></div>`);
  document.getElementById('app').appendChild(pill);
  if(window._reviewTimerInt) clearInterval(window._reviewTimerInt);
  window._reviewTimerInt = setInterval(()=>{
    const elapsed = Math.floor((Date.now()-SESSION_TIMER_START)/1000);
    const remaining = SESSION_DURATION_SEC - elapsed;
    const t=document.getElementById('timerTxt'); if(!t) return;
    if(remaining >= 0){
      const m=String(Math.floor(remaining/60)).padStart(2,'0'), s=String(remaining%60).padStart(2,'0');
      t.textContent = `${m}:${s}`;
    } else {
      const over = -remaining;
      const m=String(Math.floor(over/60)).padStart(2,'0'), s=String(over%60).padStart(2,'0');
      t.textContent = `+${m}:${s}`;
    }
  },1000);
}

/* ---- مراجعة بطاقة مفردة (وضع البطاقات الدقيقة) ---- */

  const showBack = _cardReversed ? !_cardFlip : _cardFlip;
  const text = showBack ? card.back : card.front;
  const img = showBack ? card.backImage : card.frontImage;
  const cardEl = el(`<div class="flashcard"><div>${esc(text)}${img?`<div style="margin-top:10px;"><img src="${img}" style="max-width:100%; max-height:220px; border-radius:10px;"></div>`:''}</div></div>`);

  main.querySelector('#revCardBtn').onclick=()=>{ _cardReversed=!_cardReversed; _cardFlip=false; render(); };
  if(_cardFlip){
    if(card.solutionSteps){
      const stepsBox = el(`<div id="stepsBox"></div>`);
      const showStepsBtn = el(`<button class="btn ghost sm block" style="margin-top:10px;">📝 عرض خطوات الحل</button>`);
      showStepsBtn.onclick=(e)=>{
        e.stopPropagation();
        stepsBox.innerHTML = `<div class="card" style="white-space:pre-wrap; font-size:14px; line-height:1.8; margin-top:10px;">${esc(card.solutionSteps)}</div>`;
        showStepsBtn.remove();
      };
      main.appendChild(showStepsBtn);
      main.appendChild(stepsBox);
    }
    const btnRow = el(`<div class="row" style="margin-top:10px; gap:8px;"></div>`);
    const srcBtn = el(`<button class="btn ghost sm">📖 عرض الدرس الأصلي</button>`);
    srcBtn.onclick=(e)=>{ e.stopPropagation(); openSourceTextModal(item); };
    const noteBtn = el(`<button class="btn ghost sm">🖊️ ملاحظة على هذه البطاقة</button>`);
    noteBtn.onclick=(e)=>{ e.stopPropagation(); openContextNote(item, card.id); };
    btnRow.appendChild(srcBtn); btnRow.appendChild(noteBtn);
    main.appendChild(btnRow);
    const opts=[{k:'again',label:'فشل ❌',c:'var(--danger)'},{k:'hard',label:'صعب 😓',c:'var(--warn)'},{k:'good',label:'جيد 🙂',c:'var(--book-blue)'},{k:'easy',label:'سهل 😄',c:'var(--ok)'}];
    const wrap = el(`<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;"></div>`);
    opts.forEach(o=>{
      const b = el(`<button class="btn" style="background:${o.c}; color:#fff;">${o.label}</button>`);
      b.onclick=async (e)=>{ e.stopPropagation(); await finishCardReview(item, card, o.k, unitIds, idx); };
      wrap.appendChild(b);
    });
    main.appendChild(wrap);
  } else {
    main.appendChild(el(`<div class="muted" style="text-align:center; margin-top:10px;">اضغطي البطاقة لرؤية الجواب</div>`));
  }
  const navRow = el(`<div class="row between" style="margin-top:18px;">
    <button class="btn ghost sm" id="prevUnitBtn" ${idx===0?'disabled':''}>‹ السابق</button>
    <button class="btn ghost sm" id="nextUnitBtn" ${idx>=unitIds.length-1?'disabled':''}>التالي ›</button>
  </div>`);
  main.appendChild(navRow);
  const pb = main.querySelector('#prevUnitBtn');
  if(pb && idx>0) pb.onclick=()=>{ _cardFlip=false; _cardReversed=false; nav('review', {...ROUTE.params, idx: idx-1}); };
  const nb = main.querySelector('#nextUnitBtn');
  if(nb && idx<unitIds.length-1) nb.onclick=()=>{ _cardFlip=false; _cardReversed=false; nav('review', {...ROUTE.params, idx: idx+1}); };
}
async function finishCardReview(item, card, rating, unitIds, idx){
  const wasFirstReview = !card.srs.lastReviewed;
  card.srs = srsAdvance(card.srs, rating);
  card.status = card.srs.status;
  const today = todayStr();
  STATE.log[today] = STATE.log[today]||{studied:0,reviewed:0};
  if(wasFirstReview) STATE.log[today].studied++; else STATE.log[today].reviewed++;
  updateStreak();
  await saveState();
  _cardFlip=false; _cardReversed=false;
  const nextLabel = card.srs.nextReview===today ? 'اليوم لاحقاً' : fmtShortDate(card.srs.nextReview);
  toast(`✔️ سُجِّل تقييمك، وتعود هذه البطاقة في ${nextLabel}.`, 2600);
  if(window._reviewTimerInt) clearInterval(window._reviewTimerInt);
  nav('review', {type: ROUTE.params.type, unitIds, idx: idx+1, durationMin: ROUTE.params.durationMin});
}
function updateStreak(){
  const today = todayStr();
  if(STATE.streak.lastDate===today) return;
  const yesterday = addDays(today,-1);
  if(STATE.streak.lastDate===yesterday || !isReviewDay(yesterday) || STATE.settings.freeze.active){
    STATE.streak.count = (STATE.streak.count||0)+1;
  } else { STATE.streak.count = 1; }
  STATE.streak.lastDate = today;
}

/* --- اللعبة 1: إعادة بناء الهيكل (إلزامية دائماً لوضع الملخص الشامل) --- */
function renderStructureGame(main, it, unitIds, idx){
  main.appendChild(el(`<div class="card"><h3>🧩 إعادة بناء الهيكل — ${esc(it.title)}</h3><div class="muted">رتّبي النقاط الرئيسية حسب ترتيبها الصحيح.</div></div>`));
  const order = it.parts.map((p,i)=>({id:p.id, text:p.text, correctIndex:i}));
  const shuffled = shuffleArr(order);
  const list = el(`<div id="dragList"></div>`);
  shuffled.forEach((p,i)=>{
    const label = firstWords(p.text, 12);
    list.appendChild(el(`<div class="dragitem" draggable="true" data-id="${p.id}"><span class="num">${i+1}</span><span>${esc(label)}</span></div>`));
  });
  main.appendChild(list);
  main.appendChild(el(`<button class="btn block" id="checkOrder" style="margin-top:12px;">تحقق من الترتيب</button>`));
  enableDragReorder(list);
  main.querySelector('#checkOrder').onclick=()=>{
    const items = [...list.children];
    let correctCount=0;
    items.forEach((d,i)=>{
      const ok = order.find(o=>o.id===d.dataset.id).correctIndex===i;
      d.classList.remove('correct','wrong'); d.classList.add(ok?'correct':'wrong');
      if(ok) correctCount++;
    });
    REVIEW_SESSION.implicit.structure = ratioToRating(items.length?correctCount/items.length:1);
    if(correctCount===items.length){
      toast('ممتاز! الترتيب صحيح تماماً 🎉');
      setTimeout(()=>{ REVIEW_SESSION.stage='select'; render(); }, 900);
    } else {
      toast('هناك أخطاء بالأحمر، أعيدي المحاولة أو تابعي.');
      const skip = el(`<button class="btn secondary block" style="margin-top:10px;">تجاوز إلى الاختيار التالي</button>`);
      skip.onclick=()=>{ REVIEW_SESSION.stage='select'; render(); };
      main.appendChild(skip);
    }
  };
}
function firstWords(text,n){ const w=(text||'').split(/\s+/); return w.slice(0,n).join(' ') + (w.length>n?'…':''); }
function shuffleArr(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function enableDragReorder(list){
  let dragEl=null;
  [...list.children].forEach(item=>{
    item.addEventListener('dragstart', ()=>{ dragEl=item; item.classList.add('dragging'); });
    item.addEventListener('dragend', ()=>{ item.classList.remove('dragging'); });
    item.addEventListener('dragover', (e)=>{ e.preventDefault(); const after=getDragAfter(list,e.clientY); if(after==null) list.appendChild(dragEl); else list.insertBefore(dragEl, after); });
  });
  [...list.children].forEach((item)=>{
    const ctr = el(`<span style="margin-inline-start:auto; display:flex; gap:4px;"><button class="btn ghost sm" data-up>▲</button><button class="btn ghost sm" data-down>▼</button></span>`);
    item.appendChild(ctr);
    ctr.querySelector('[data-up]').onclick=()=>{ const prev=item.previousElementSibling; if(prev) list.insertBefore(item, prev); };
    ctr.querySelector('[data-down]').onclick=()=>{ const next=item.nextElementSibling; if(next) list.insertBefore(next, item); };
  });
}
function getDragAfter(list, y){
  const els=[...list.querySelectorAll('.dragitem:not(.dragging)')];
  return els.reduce((closest,child)=>{ const box=child.getBoundingClientRect(); const offset=y-box.top-box.height/2; if(offset<0 && offset>closest.offset){ return {offset, element:child}; } return closest; }, {offset:-Infinity}).element;
}

  card.onclick=()=>{ REVIEW_SESSION.qaFlip=!REVIEW_SESSION.qaFlip; render(); };
  main.appendChild(card);
