  main.querySelector('#delQBtn').onclick=async ()=>{
    if(!confirm('حذف هذا السؤال نهائياً من هذا العنصر؟ لن يظهر في المراجعات القادمة.')) return;
    const part = it.parts.find(p=>p.id===cur.partId);
    if(part) part.qa = null;
    await saveState();
    REVIEW_SESSION.qaQueue = Q.filter(q=>q.key!==cur.key);
    REVIEW_SESSION.qaCurrent = null;
    render();
  };
  main.appendChild(el(`<div class="row" style="margin-top:16px;"><button class="btn secondary" id="hardBtn">صعب 😓</button><button class="btn" id="knowBtn">أعرفها ✅</button></div>`));
  main.querySelector('#knowBtn').onclick=()=>{ cur.correctStreak++; REVIEW_SESSION.qaStats.correct++; advanceQA(); };
  main.querySelector('#hardBtn').onclick=()=>{ cur.correctStreak=0; REVIEW_SESSION.qaStats.wrong++; advanceQA(); };
  main.appendChild(el(`<div class="row between" style="margin-top:16px;"><button class="btn ghost sm" id="prevQ">‹ السابق</button><button class="btn ghost sm" id="nextQ">تخطَّ (لا يُحتسب) ›</button></div>`));
  main.querySelector('#prevQ').onclick=()=>{ if(REVIEW_SESSION.qaPos>0){ REVIEW_SESSION.qaPos--; REVIEW_SESSION.qaCurrent=REVIEW_SESSION.qaHistory[REVIEW_SESSION.qaPos]; REVIEW_SESSION.qaFlip=false; render(); } };
  main.querySelector('#nextQ').onclick=()=>advanceQA();
  function advanceQA(){
    if(REVIEW_SESSION.qaPos===-1 || REVIEW_SESSION.qaHistory[REVIEW_SESSION.qaPos]!==cur){ REVIEW_SESSION.qaHistory.push(cur); REVIEW_SESSION.qaPos=REVIEW_SESSION.qaHistory.length-1; }
    const remaining = Q.filter(q=>q.correctStreak<2);
    if(!remaining.length){ REVIEW_SESSION.qaCurrent=null; render(); return; }
    // امنعي تكرار نفس السؤال فوراً بعد ظهوره إن وُجد غيره متبقياً (لا عشوائية صرفة قد تُعيده مباشرة)

    REVIEW_SESSION.qaCurrent = pool[Math.floor(Math.random()*pool.length)];
    REVIEW_SESSION.qaFlip=false; render();
  }
}

/* مقارنة كلمة بكلمة عبر أطول تتابع مشترك (LCS) بدل المقارنة بالموضع الرقمي؛ هذا يمنع
   أن تُبرَز كل الكلمات اللاحقة كـ"مختلفة" لمجرد أن كلمة واحدة أُدرجت أو حُذفت في المنتصف،
   فتبقى الفقرة مقروءة بأسطر طبيعية بدل تفتّتها كلمة كلمة. */
function wordDiffHighlight(broken, correct){
  const bw = broken.split(/\s+/).filter(Boolean);
  const cw = correct.split(/\s+/).filter(Boolean);
  const m = bw.length, n = cw.length;
  const dp = Array.from({length:m+1}, ()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = (bw[i-1]===cw[j-1]) ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  const commonInC = new Array(n).fill(false);
  let i=m, j=n;
  while(i>0 && j>0){
    if(bw[i-1]===cw[j-1]){ commonInC[j-1]=true; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--;
    else j--;
  }
  return cw.map((w,idx)=> commonInC[idx] ? esc(w) : `<span class="diff-added">${esc(w)}</span>`).join(' ');
}

async function finishItemReview(it, manualRating, unitIds, idx){
  const implicitList = Object.values(REVIEW_SESSION.implicit).filter(Boolean);
  const finalRating = weakestRating([manualRating, ...implicitList]);
  const wasFirstReview = !it.srs.lastReviewed;
  it.srs = srsAdvance(it.srs, finalRating);
  it.status = it.srs.status;
  const today = todayStr();
  STATE.log[today] = STATE.log[today]||{studied:0,reviewed:0};
  if(wasFirstReview) STATE.log[today].studied++; else STATE.log[today].reviewed++;
  updateStreak();
  await saveState();
  const today2 = todayStr();
  const nextLabel = it.srs.nextReview===today2 ? 'اليوم لاحقاً' : fmtShortDate(it.srs.nextReview);
  toast(`✔️ سُجِّل تقييمك، وتعود هذه الحلقة في ${nextLabel}.`, 2600);
  REVIEW_SESSION = null;
  if(window._reviewTimerInt) clearInterval(window._reviewTimerInt);
  nav('review', {type: ROUTE.params.type, unitIds, idx: idx+1, durationMin: ROUTE.params.durationMin});
}

    folderSel.setOptions([{value:'', label:'بدون مجلد ملاحظات'}, ...Object.values(STATE.noteFolders||{}).map(f=>({value:f.id, label:f.name}))]);

  function drawTagFilters(){
    const row = root.querySelector('#filterTagsRow'); row.innerHTML='';
    STATE.settings.noteTags.forEach(tag=>{
      const count = Object.values(STATE.notes).filter(n=>!n.archived && (n.tags||[]).includes(tag)).length;
      const on = filterState.tags.includes(tag);
      const chip = el(`<span class="tag-chip ${on?'on':''}" style="cursor:pointer; ${on?`background:${tagColor(tag)}; color:#fff; border-color:${tagColor(tag)};`:''}">${esc(tag)} (${count})</span>`);
      chip.onclick=()=>{ filterState.tags = on ? filterState.tags.filter(t=>t!==tag) : [...filterState.tags, tag]; drawTagFilters(); drawNotes(); };
      row.appendChild(chip);
    });
  }
  drawTagFilters();
  root.querySelector('#showArchivedChk').onchange=(e)=>{ filterState.showArchived=e.target.checked; drawNotes(); };

  function drawNotes(){
    const list = root.querySelector('#notesList'); list.innerHTML='';
    let notes = Object.values(STATE.notes);
    notes = notes.filter(n=> filterState.showArchived ? true : !n.archived);
    if(filterState.search) notes = notes.filter(n=>n.text.includes(filterState.search));
    if(filterState.tags.length) notes = notes.filter(n=> filterState.tags.every(t=>(n.tags||[]).includes(t)));
    if(filterState.folderId!=='__any__') notes = notes.filter(n=> (n.folderId||'')===filterState.folderId);
    if(filterState.linkedItemId) notes = notes.filter(n=> n.linkedItemId===filterState.linkedItemId);
    if(filterState.linkedLibraryFolderId) notes = notes.filter(n=> n.linkedLibraryFolderId===filterState.linkedLibraryFolderId);
    notes.sort((a,b)=> (b.pinned===a.pinned?0:(b.pinned?1:-1)) || b.createdAt-a.createdAt);
    if(!notes.length){ list.appendChild(el(`<div class="empty">لا ملاحظات مطابقة.</div>`)); return; }
    notes.forEach(n=>{
      const linkedItem = n.linkedItemId && STATE.items[n.linkedItemId];
      const linkedFolder = n.linkedLibraryFolderId && STATE.folders[n.linkedLibraryFolderId];
      const linkLabel = linkedItem ? '🎓 '+esc(linkedItem.title) : (linkedFolder ? '📁 '+esc(linkedFolder.name) : '');
      const card = el(`<div class="card" style="${n.archived?'opacity:.6;':''}">
        <div class="row between"><span class="muted">${fmtShortDate(todayStr0(n.createdAt))} ${linkLabel?'· '+linkLabel:''}</span>
        <span style="cursor:pointer;" data-pin>${n.pinned?'📌':'📍'}</span></div>
        <div style="margin-top:6px; font-size:14px; white-space:pre-wrap;">${esc(n.text)}</div>
        <div class="row wrap" style="gap:5px; margin-top:8px;">${(n.tags||[]).map(t=>`<span class="tag-chip" style="border-color:${tagColor(t)}; color:${tagColor(t)};">${esc(t)}</span>`).join('')}</div>
        <div class="row wrap" style="margin-top:8px; gap:6px;">
          <button class="btn ghost sm" data-edit>✏️ تعديل</button>
          <button class="btn ghost sm" data-tocard>🗂️ حوّلي إلى بطاقة</button>
          <button class="btn ghost sm" data-archive>${n.archived?'إرجاع من الأرشيف':'أرشفة'}</button>
          <button class="btn ghost sm" data-del style="color:var(--danger);">حذف</button>
        </div>
      </div>`);
      card.querySelector('[data-pin]').onclick=async ()=>{ n.pinned=!n.pinned; await saveState(); drawNotes(); };
      card.querySelector('[data-archive]').onclick=async ()=>{ n.archived=!n.archived; await saveState(); drawNotes(); };
      card.querySelector('[data-del]').onclick=async ()=>{
        const warn = n.generatedCardIds && n.generatedCardIds.length
          ? `تنبيه: أنشأتِ ${n.generatedCardIds.length} بطاقة من هذه الملاحظة سابقاً؛ ستبقى تلك البطاقات في مجموعتها ولن تُحذف. هل تريدين حذف الملاحظة نفسها؟`
          : 'هل تريدين حذف هذه الملاحظة نهائياً؟';
        if(!confirm(warn)) return;
        delete STATE.notes[n.id]; await saveState(); drawNotes();
      };
      card.querySelector('[data-tocard]').onclick=()=>openNoteToCardModal(n);
      card.querySelector('[data-edit]').onclick=()=>openNoteEditModal(n, drawNotes);
      list.appendChild(card);
    });
  }
  root.querySelector('#noteSearch').oninput=(e)=>{ filterState.search=e.target.value; drawNotes(); };
  root.querySelector('#addNoteBtn').onclick=async ()=>{
    const text = root.querySelector('#newNoteText').value.trim();
    if(!text) return;
    const id=uid();
    STATE.notes[id]={ id, text, folderId: folderSel.getValue()||null, linkedItemId: itemSel.getValue()||null,
      linkedLibraryFolderId: libFolderSel.getValue()||null, linkedCardId:null,

    newNoteTags=[]; tagPicker.querySelectorAll('.tag-chip').forEach(c=>{c.classList.remove('on'); c.style.background=''; c.style.color='';});
    drawTagFilters(); drawNotes();
  };
  drawNotes();
}
/* تعديل ملاحظة موجودة: النص والوسوم، دون المساس بروابطها أو بطاقاتها المولَّدة */
function openNoteEditModal(n, onSaved){
  openModal(`<h3 style="font-family:var(--font-head);">تعديل الملاحظة</h3>
    <textarea id="editNoteText" style="min-height:140px;">${esc(n.text)}</textarea>
    <div class="row wrap" id="editTagPicker" style="margin:10px 0; gap:6px;"></div>
    <button class="btn block" id="saveEditNote">حفظ التعديل</button>`, (root)=>{
    const tagPicker = root.querySelector('#editTagPicker');
    let tags = [...(n.tags||[])];
    STATE.settings.noteTags.forEach(tag=>{
      const on = tags.includes(tag);
      const chip = el(`<span class="tag-chip ${on?'on':''}" style="cursor:pointer; ${on?`background:${tagColor(tag)}; color:#fff; border-color:${tagColor(tag)};`:`border-color:${tagColor(tag)};`}">${esc(tag)}</span>`);
      chip.onclick=()=>{
        if(tags.includes(tag)){ tags=tags.filter(t=>t!==tag); chip.classList.remove('on'); chip.style.background=''; chip.style.color=''; }
        else { tags.push(tag); chip.classList.add('on'); chip.style.background=tagColor(tag); chip.style.color='#fff'; }
      };
      tagPicker.appendChild(chip);
    });
    root.querySelector('#saveEditNote').onclick=async ()=>{
      const text = root.querySelector('#editNoteText').value.trim();
      if(!text){ toast('لا يمكن أن تكون الملاحظة فارغة'); return; }
      n.text = text; n.tags = tags;
      await saveState(); closeModal(); toast('تم حفظ التعديل'); if(onSaved) onSaved();
    };
  });
}

/* التقاط ملاحظة سياقية أثناء المراجعة: إن وُجدت ملاحظة سابقة لنفس البطاقة/العنصر تُفتح للتعديل، لا تُكرَّر */
function openContextNote(item, cardId){
  const existing = Object.values(STATE.notes).find(n=> cardId ? n.linkedCardId===cardId : (n.linkedItemId===item.id && !n.linkedCardId));
  if(existing){
    openModal(`<h3 style="font-family:var(--font-head);">تعديل الملاحظة</h3>
      <textarea id="ctxNoteText">${esc(existing.text)}</textarea>
      <button class="btn block" id="saveCtxNote" style="margin-top:10px;">حفظ</button>`, (root)=>{
      root.querySelector('#saveCtxNote').onclick=async ()=>{ existing.text=root.querySelector('#ctxNoteText').value.trim(); await saveState(); closeModal(); toast('تم التحديث'); };
    });
    return;
  }
  openModal(`<h3 style="font-family:var(--font-head);">ملاحظة جديدة — ${esc(item.title)}</h3>
    <textarea id="ctxNoteText" placeholder="اكتبي ملاحظتك..."></textarea>
    <button class="btn block" id="saveCtxNote" style="margin-top:10px;">حفظ</button>`, (root)=>{
    root.querySelector('#saveCtxNote').onclick=async ()=>{
      const text = root.querySelector('#ctxNoteText').value.trim();
      if(!text) return;
      const id=uid();
      STATE.notes[id]={ id, text, folderId:null, linkedItemId:item.id, linkedCardId:cardId||null, tags:[], pinned:false, archived:false, createdAt:Date.now(), generatedCardIds:[] };
      await saveState(); closeModal(); toast('تم حفظ الملاحظة');
    };
  });
}

/* تحويل ملاحظة إلى بطاقة حفظ حقيقية داخل عنصر بطاقات دقيقة، مع تحقّق فعلي بعدّ البطاقات */
function openNoteToCardModal(note){
  const cardItems = allItems().filter(it=>it.mode==='cards');
  if(!cardItems.length){ toast('أنشئي أولاً عنصراً بوضع "بطاقات دقيقة" لتحويل الملاحظات إليه.'); return; }
  const firstLine = note.text.split('\n')[0].slice(0,80);
  openModal(`<h3 style="font-family:var(--font-head);">تحويل الملاحظة إلى بطاقة</h3>
    <label class="field"><span>السؤال المقترح</span><input type="text" id="n2cQ" value="${esc(firstLine)}"></label>
    <label class="field"><span>الجواب</span><textarea id="n2cA">${esc(note.text)}</textarea></label>
    <label class="field"><span>أضيفيها إلى عنصر</span></label>
    <div id="n2cItemSelWrap" style="margin-bottom:14px;"></div>
    <button class="btn block" id="n2cSave">إنشاء البطاقة</button>`, (root)=>{
    const sel = customSelect(cardItems.map(it=>({value:it.id, label:it.title})), cardItems[0].id);
    root.querySelector('#n2cItemSelWrap').appendChild(sel);
    root.querySelector('#n2cSave').onclick=async ()=>{
      const targetId = sel.getValue();
      const target = STATE.items[targetId];
      const q = root.querySelector('#n2cQ').value.trim(), a = root.querySelector('#n2cA').value.trim();
      if(!q || !a){ toast('الرجاء تعبئة السؤال والجواب'); return; }
      const before = target.cards.length;
      const newCard = { id:uid(), front:q, back:a, srs:{intervalDays:0,ease:2.3,reps:0,lastReviewed:null,nextReview:todayStr()}, status:'learning' };
      target.cards.push(newCard);
      const after = target.cards.length;
      note.generatedCardIds = note.generatedCardIds||[]; note.generatedCardIds.push(newCard.id);
      await saveState();
      if(after===before+1){ toast(`تم إنشاء البطاقة فعلياً داخل "${target.title}" (${before}→${after} بطاقة)، ودخلت جدولة المراجعة.`); }
      closeModal();
      render();
    };
  });
}

function copyText(text, msg){
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(()=>fallbackCopy(text,msg)); }
  else fallbackCopy(text,msg);
}
function fallbackCopy(text,msg){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(msg); }catch(e){ toast('تعذّر النسخ التلقائي، انسخي يدوياً.'); }
  ta.remove();
}

    <div class="muted" style="margin-top:8px;">إن أضفتِ التطبيق سابقاً إلى الشاشة الرئيسية ثم حدّثتِ الأيقونة، احذفي الاختصار القديم وأعيدي إضافته من جديد لتظهر الأيقونة المحدَّثة، فالهواتف تحتفظ بالأيقونة القديمة مؤقتاً.</div>
  </div>`));
}

/* ============================================================
   شبكة أمان عامة
   ============================================================ */
window.addEventListener('error', (e)=>{ try{ toast('⚠️ حدث خطأ غير متوقع، حاولي مرة أخرى. إن تكرر فصدّري نسخة احتياطية لحماية بياناتك.', 5000); }catch(_e){} });
window.addEventListener('unhandledrejection', (e)=>{ try{ toast('⚠️ حدث خطأ غير متوقع، حاولي مرة أخرى.', 4000); }catch(_e){} });

/* ============================================================
   بدء التشغيل
   ============================================================ */
render();
loadState().then(async s=>{
  STATE = s;
  render();
});

setInterval(()=>{
  const gap = checkAbsence();
  if(gap>1){
    STATE.settings.missStreakCount = (STATE.settings.missStreakCount||0)+1;
    const msgs = STATE.settings.missStreakCount>2 ? NUDGES_REPEAT : NUDGES_MISS;
    if(STATE.settings.notificationsEnabled) notify('تذكير الالتزام', msgs[Math.floor(Math.random()*msgs.length)]);
  }
}, 1000*60*60*6);

</script>
</body>
</html>
